<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E5661">
<title>Julia Paz, psicóloga. Turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--paper:#fff;--ink:#14282E;--mut:#4B5F65;--line:#CBD6D8;--pet:#1E5661;--pet2:#17444D;--amb:#D9972B;--ambbg:#FBF1DC;--off:#7F9094;--red:#9B3B2E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:Literata,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 56px}
.mut{color:var(--mut)}

/* cabecera */
.top{display:flex;gap:14px;align-items:center;padding:26px 0 8px}
.mono{flex:none;width:56px;height:56px;border-radius:50%;background:var(--pet);color:#fff;display:grid;place-items:center;font:600 22px Literata,Georgia,serif;letter-spacing:.5px}
.top h1{font-size:30px}
.top p{color:var(--mut);font-size:17px;margin-top:2px}
.lead{margin:10px 0 22px;font-size:19px}

/* hoja de agenda */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet>h2{font-size:23px;padding:18px 16px 4px}
.sheet>.sub{padding:0 16px 14px;color:var(--mut);font-size:17px}
.seg{display:flex;margin:0 16px 14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:#fff;font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.days{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:66px;min-height:74px;padding:8px 0 6px;border:0;border-right:1px solid var(--line);border-bottom:4px solid transparent;background:#fff;text-align:center;line-height:1.1}
.days button b{display:block;font:600 25px Literata,Georgia,serif;margin-top:3px}
.days button span{font-size:16px;color:var(--mut)}
.days button.on{background:var(--ambbg);border-bottom-color:var(--amb)}
.days button:disabled{cursor:default;color:var(--off);background:#F7F9F9}
.days button:disabled span,.days button:disabled b{color:var(--off)}
.daytitle{padding:14px 16px 10px;border-top:1px solid var(--line);font-weight:700}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;min-height:58px;padding:6px 16px;border-top:1px solid var(--line)}
.row .t{font-weight:700;font-size:21px}
.row .s{color:var(--pet);font-weight:700}
.row.off .t{color:var(--off);text-decoration:line-through}
.row.off .s{color:var(--off);font-weight:400}
.row.sel{background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}
.row .who{font-weight:700;line-height:1.25}
.row .tag{display:block;font-weight:400;font-size:16px;color:var(--mut)}
.row .tag b{color:var(--red)}
.empty{padding:18px 16px;border-top:1px solid var(--line);color:var(--mut)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border:2px solid var(--pet);border-radius:8px;background:var(--pet);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn.w{width:100%}
.btn.o{background:#fff;color:var(--pet)}
.btn.sm{min-height:42px;padding:0 14px;font-size:17px}
.btn.del{background:#fff;color:var(--red);border-color:var(--red)}
.acts{display:grid;gap:8px;padding:4px 16px 16px;background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}

/* formularios */
.form{padding:16px;border-top:1px solid var(--line)}
.form h3{font-size:20px;margin-bottom:4px}
label{display:block;font-weight:700;margin:14px 0 5px}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;min-height:50px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--pet);outline:0}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:14px 0 0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--pet)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg);font-weight:700}
.gap{margin-top:16px}

/* pedido hecho */
.done{padding:22px 16px}
.done h2{font-size:26px}
.bubble{margin:10px 0 0;padding:12px 14px;border-radius:4px 14px 14px 14px;background:#E3F3E1;border:1px solid #BFDDBB;white-space:pre-line;font-size:17px;line-height:1.4}

/* info y pie */
.info{margin-top:26px}
.info h2{font-size:22px;margin-bottom:6px}
.info dl{margin:0}
.info dt{font-weight:700;margin-top:14px}
.info dd{margin:2px 0 0;color:var(--mut)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--mut)}

/* panel */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0 12px}
.ptop h1{font-size:25px}
.tabs{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:16px}
.tabs button{flex:1;min-height:46px;border:0;background:#fff;font-weight:700}
.tabs button.on{background:var(--ink);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.note{margin:0 0 16px;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg)}
.note b{display:block}
.hrow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.hrow select{min-height:46px;padding:6px 8px}
.hrow .chk{margin:0;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="site"></div>
  <div id="panel" hidden></div>
</div>
<div id="toast" role="status"></div>

<script>
// ===== Datos del profesional (se adaptan a cada cliente) =====
const DEMO = true;                 // muestra: nada sale de este celular
const KEY = 'turnos_muestra_v1';
const DEFAULT = {
  name:'Julia Paz', short:'Julia', role:'Psicóloga', mono:'JP',
  lead:'Atiendo a adultos, en consultorio en Rosario y por videollamada.',
  wa:'', modes:['Presencial','Online'], place:'Zona centro, Rosario. La dirección exacta te llega al confirmar.',
  dur:50, step:60, cancel:'Si no podés venir, avisame con 24 horas de anticipación.', fee:'Te los paso al confirmar el turno.',
  days:{1:{on:true,from:'14:00',to:'20:00'},2:{on:true,from:'14:00',to:'20:00'},3:{on:true,from:'09:00',to:'13:00'},4:{on:true,from:'14:00',to:'20:00'},5:{on:true,from:'09:00',to:'13:00'},6:{on:false,from:'09:00',to:'12:00'}},
  blocked:[], blockedSlots:[]
};
const WD = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const WD3 = ['dom','lun','mar','mié','jue','vie','sáb'];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// ===== Utilidades =====
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const day = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => iso(new Date());
const longDate = s => { const d = day(s); return WD[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]; };
const shortDate = s => { const d = day(s); return WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1); };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const mins = t => { const p = t.split(':').map(Number); return p[0]*60+p[1]; };
const hhmm = m => pad(Math.floor(m/60))+':'+pad(m%60);
const uid = () => 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let toastT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function waNum(p){ let n = String(p||'').replace(/\D/g,''); if(!n) return ''; if(!n.startsWith('54')) n = '549'+n.replace(/^0/,''); return n; }
const waLink = (p,txt) => 'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(txt);

// ===== Estado (en la muestra vive solo en este celular) =====
function seed(){
  const base = new Date(), mon = addDays(base, -((base.getDay()+6)%7));
  const w = (off,time,name,phone,mode) => ({id:uid(), date:iso(addDays(mon,off)), time, name, phone, mode, first:false, status:'confirmado', weekly:true, skip:[]});
  const turnos = [ w(0,'15:00','Marcela R.','341 555 0101','Presencial'), w(0,'18:00','Tomás G.','341 555 0102','Online'), w(1,'16:00','Lucía F.','341 555 0103','Presencial'),
    w(2,'10:00','Hernán P.','341 555 0104','Presencial'), w(3,'17:00','Carla M.','341 555 0105','Online'), w(4,'11:00','Diego A.','341 555 0106','Presencial') ];
  const s = {cfg:JSON.parse(JSON.stringify(DEFAULT)), turnos};
  let n = 0;
  for(let i=1;i<10 && n<2;i++){ const d = iso(addDays(base,i)); const f = freeSlots(d, s); if(f.length>1){ s.turnos.push({id:uid(), date:d, time:f[1], name:n?'Sofía B.':'Martín L.', phone:n?'341 555 0108':'341 555 0107', mode:n?'Online':'Presencial', first:true, status:'pedido', weekly:false, skip:[]}); n++; } }
  return s;
}
let S;
function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.cfg && r.turnos){ S = r; return; } }catch(e){} S = seed(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ===== Agenda =====
function slots(date, s){ s = s||S; const c = s.cfg.days[day(date).getDay()]; if(!c || !c.on || s.cfg.blocked.includes(date)) return []; const out = []; for(let m = mins(c.from); m + Math.min(s.cfg.step, s.cfg.dur) <= mins(c.to); m += s.cfg.step) out.push(hhmm(m)); return out; }
function turnoAt(date, time, s){ s = s||S; const wd = day(date).getDay(); return s.turnos.find(t => t.time===time && (t.date===date || (t.weekly && date>t.date && day(t.date).getDay()===wd && !(t.skip||[]).includes(date)))); }
const isBlocked = (date,time,s) => (s||S).cfg.blockedSlots.includes(date+'|'+time);
function freeSlots(date, s){ const now = new Date(), lim = now.getHours()*60+now.getMinutes()+120, td = today(); return slots(date,s).filter(t => !turnoAt(date,t,s) && !isBlocked(date,t,s) && (date>td || (date===td && mins(t)>lim))); }
const nextDays = n => Array.from({length:n}, (_,i) => iso(addDays(new Date(), i)));

// ===== Página pública =====
let P = {mode:null, date:null, time:null, step:'pick', last:null};
function renderSite(){
  const c = S.cfg; if(!P.mode || !c.modes.includes(P.mode)) P.mode = c.modes[0];
  const ds = nextDays(14); if(!P.date || !freeSlots(P.date).length) P.date = ds.find(d => freeSlots(d).length) || null;
  let h = `<header class="top"><div class="mono" aria-hidden="true">${esc(c.mono)}</div><div><h1>${esc(c.name)}</h1><p>${esc(c.role)}</p></div></header><p class="lead">${esc(c.lead)}</p>`;
  if(P.step==='done' && P.last){ const t = P.last;
    h += `<section class="sheet"><div class="done"><h2>Turno pedido</h2><p class="gap"><b>${esc(cap(longDate(t.date)))}, ${t.time}</b><br>${esc(t.mode)}, ${c.dur} minutos.</p><p class="gap">${esc(c.short)} te lo confirma por WhatsApp.</p>
      ${DEMO ? `<p class="gap mut">Así le llega el pedido a ${esc(c.short)}:</p><div class="bubble">${esc(msgPedido(t))}</div>` : ''}
      <button class="btn o w gap" data-a="again">Pedir otro turno</button></div></section>`;
  } else {
    h += `<section class="sheet"><h2>Elegí día y horario</h2><p class="sub">Turnos de ${c.dur} minutos. Mirá los libres y pedí el tuyo.</p>`;
    if(c.modes.length>1) h += `<div class="seg" role="group" aria-label="Modalidad">${c.modes.map(m => `<button data-a="mode" data-v="${esc(m)}" class="${m===P.mode?'on':''}" aria-pressed="${m===P.mode}">${esc(m)}</button>`).join('')}</div>`;
    h += `<div class="days">${ds.map(d => { const dd = day(d), n = freeSlots(d).length; return `<button data-a="day" data-v="${d}" class="${d===P.date?'on':''}" ${n?'':'disabled'} aria-label="${esc(longDate(d))}${n?'':', sin turnos'}"><span>${WD3[dd.getDay()]}</span><b>${dd.getDate()}</b></button>`; }).join('')}</div>`;
    if(!P.date) h += `<p class="empty">No quedan turnos libres en los próximos días. Escribile a ${esc(c.short)}.</p>`;
    else { h += `<div class="daytitle">${esc(cap(longDate(P.date)))}</div>`;
      slots(P.date).forEach(t => { const free = freeSlots(P.date).includes(t);
        h += free ? `<div class="row ${P.time===t?'sel':''}"><span class="t">${t}</span><span class="s">Libre</span><button class="btn sm ${P.time===t?'':'o'}" data-a="time" data-v="${t}">${P.time===t?'Elegido':'Elegir'}</button></div>`
                  : `<div class="row off"><span class="t">${t}</span><span class="s">Ocupado</span><span></span></div>`; });
    }
    if(P.time) h += `<div class="form" id="datos"><h3>Tus datos</h3><p class="pick">${esc(cap(longDate(P.date)))}, ${P.time}. ${esc(P.mode)}.</p>
      <label for="fN">Nombre y apellido</label><input id="fN" type="text" autocomplete="name">
      <label for="fP">Tu WhatsApp</label><input id="fP" type="tel" autocomplete="tel" placeholder="Ej.: 341 555 1234">
      <label class="chk"><input id="fF" type="checkbox"> Es mi primera consulta</label>
      <button class="btn w gap" data-a="send">Pedir este turno</button>
      <p class="mut gap">${esc(c.cancel)}</p></div>`;
    h += `</section>`;
  }
  h += `<section class="info"><h2>Antes de venir</h2><dl>
    <dt>Dónde</dt><dd>${c.modes.includes('Presencial') ? esc(c.place) : 'Por videollamada.'}${c.modes.includes('Presencial') && c.modes.includes('Online') ? ' Online, por videollamada.' : ''}</dd>
    <dt>Cuánto dura</dt><dd>${c.dur} minutos.</dd><dt>Honorarios</dt><dd>${esc(c.fee)}</dd><dt>Si tenés que cancelar</dt><dd>${esc(c.cancel)}</dd></dl></section>
    <footer><span>${esc(c.name)}, ${esc(c.role.toLowerCase())}</span><a href="#panel">Acceso ${esc(c.short)}</a></footer>`;
  $('#site').innerHTML = h;
}
function msgPedido(t){ return `Hola ${S.cfg.short}! Quiero pedir un turno:\n${cap(longDate(t.date))}, ${t.time} (${t.mode.toLowerCase()})\nNombre: ${t.name}\nWhatsApp: ${t.phone}${t.first?'\nEs mi primera consulta.':''}`; }

// ===== Panel =====
let A = {ok:false, tab:'ag', date:null, open:null, form:null, msg:null};
function renderPanel(){
  const c = S.cfg, el = $('#panel');
  if(!A.ok){ el.innerHTML = `<div class="ptop"><h1>Acceso ${esc(c.short)}</h1><a class="btn o sm" href="#">Volver</a></div><section class="sheet"><div class="form" style="border:0"><label for="pin" style="margin-top:0">Tu clave</label><input id="pin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off"><button class="btn w gap" data-a="pin">Entrar</button>${DEMO?'<p class="mut gap">En esta muestra la clave es 1234.</p>':''}</div></section>`; return; }
  if(!A.date) A.date = today();
  let h = `<div class="ptop"><h1>Tu agenda</h1><a class="btn o sm" href="#">Ver mi página</a></div>
    <div class="tabs" role="tablist">${[['ag','Agenda'],['ho','Horarios'],['ma','Más']].map(([k,l]) => `<button role="tab" data-a="tab" data-v="${k}" class="${A.tab===k?'on':''}" aria-selected="${A.tab===k}">${l}</button>`).join('')}</div>`;
  if(A.tab==='ag') h += viewAgenda(); if(A.tab==='ho') h += viewHoras(); if(A.tab==='ma') h += viewMas();
  el.innerHTML = h;
}
function listPend(){ const td = today(); return S.turnos.filter(t => t.status==='pedido' && t.date>=td).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time)); }
function viewAgenda(){
  const c = S.cfg, pend = listPend(); let h = '';
  if(A.msg) h += `<div class="note"><b>${esc(A.msg.title)}</b><div class="bubble">${esc(A.msg.text)}</div><div class="quick gap" style="margin-bottom:0"><a class="btn sm" target="_blank" rel="noopener" href="${esc(A.msg.href)}">Abrir WhatsApp</a><button class="btn o sm" data-a="msgx">Cerrar</button></div></div>`;
  if(A.form) return h + viewForm();
  h += `<div class="quick"><button class="btn" data-a="new">Agendar turno</button><button class="btn o" data-a="link">Copiar mi link</button></div>`;
  if(pend.length) h += `<p class="note"><b>${pend.length===1?'Tenés 1 turno por confirmar':'Tenés '+pend.length+' turnos por confirmar'}</b>${pend.map(t => `${esc(t.name)}, ${esc(shortDate(t.date))} ${t.time}`).join('<br>')}</p>`;
  h += `<section class="sheet"><div class="days" style="border-top:0">${nextDays(14).map(d => { const dd = day(d); return `<button data-a="pday" data-v="${d}" class="${d===A.date?'on':''}" aria-label="${esc(longDate(d))}"><span>${d===today()?'hoy':WD3[dd.getDay()]}</span><b>${dd.getDate()}</b></button>`; }).join('')}</div>
    <div class="daytitle">${esc(cap(longDate(A.date)))}</div>`;
  const sl = slots(A.date);
  if(S.cfg.blocked.includes(A.date)) h += `<p class="empty">Día bloqueado: no se ofrecen turnos.</p><div class="form"><button class="btn o w" data-a="unblockday">Volver a atender este día</button></div>`;
  else if(!sl.length) h += `<p class="empty">Este día no atendés. Lo cambiás en Horarios.</p>`;
  else { sl.forEach(t => { const tu = turnoAt(A.date,t), key = A.date+'|'+t;
      if(tu){ const open = A.open===key; h += `<div class="row ${open?'sel':''}"><span class="t">${t}</span><span class="who">${esc(tu.name)}<span class="tag">${tu.status==='pedido'?'<b>Sin confirmar.</b> ':''}${esc(tu.mode)}${tu.weekly?', turno fijo':''}${tu.first?', primera consulta':''}</span></span><button class="btn o sm" data-a="open" data-v="${key}" aria-expanded="${open}">${open?'Cerrar':'Ver'}</button></div>`;
        if(open) h += `<div class="acts">${tu.status==='pedido'?`<button class="btn" data-a="conf" data-id="${tu.id}">Confirmarle por WhatsApp</button>`:''}<button class="btn o" data-a="rem" data-id="${tu.id}">Recordarle por WhatsApp</button><a class="btn o" target="_blank" rel="noopener" href="${esc(calLink(tu, A.date))}">Pasarlo a mi Google Calendar</a>${tu.weekly?`<button class="btn del" data-a="skip" data-id="${tu.id}">Liberar solo este día</button><button class="btn del" data-a="del" data-id="${tu.id}">Terminar el turno fijo</button>`:`<button class="btn del" data-a="del" data-id="${tu.id}">Cancelar el turno</button>`}</div>`; }
      else if(isBlocked(A.date,t)) h += `<div class="row off"><span class="t">${t}</span><span class="s">Bloqueado</span><button class="btn o sm" data-a="unblock" data-v="${key}">Liberar</button></div>`;
      else h += `<div class="row"><span class="t">${t}</span><span class="s">Libre</span><span style="display:flex;gap:6px"><button class="btn sm" data-a="new" data-v="${key}">Agendar</button><button class="btn o sm" data-a="block" data-v="${key}">Bloquear</button></span></div>`; });
    h += `<div class="form"><button class="btn o w" data-a="blockday">Bloquear todo este día</button></div>`; }
  return h + `</section>`;
}
function viewForm(){ const f = A.form, free = freeOrAll(f.date);
  return `<section class="sheet"><div class="form" style="border:0"><h3>Agendar un turno</h3><p class="mut">Para cuando te escriben y lo anotás vos.</p>
    <div class="two"><div><label for="nD">Día</label><input id="nD" type="date" min="${today()}" value="${f.date}"></div><div><label for="nT">Hora</label><select id="nT">${free.length?free.map(t => `<option ${t===f.time?'selected':''}>${t}</option>`).join(''):'<option value="">Sin lugar</option>'}</select></div></div>
    <label for="nN">Nombre</label><input id="nN" type="text" value="${esc(f.name||'')}"><label for="nP">WhatsApp</label><input id="nP" type="tel" value="${esc(f.phone||'')}">
    ${S.cfg.modes.length>1?`<label for="nM">Modalidad</label><select id="nM">${S.cfg.modes.map(m => `<option>${esc(m)}</option>`).join('')}</select>`:''}
    <label class="chk"><input id="nW" type="checkbox"> Turno fijo: repetir todas las semanas</label>
    <div class="quick gap" style="margin-bottom:0"><button class="btn" data-a="nsave">Guardar turno</button><button class="btn o" data-a="ncancel">Cancelar</button></div></div></section>`; }
function freeOrAll(date){ return slots(date).filter(t => !turnoAt(date,t) && !isBlocked(date,t)); }
function viewHoras(){ const c = S.cfg, hs = []; for(let m=7*60;m<=22*60;m+=30) hs.push(hhmm(m));
  return `<section class="sheet"><h2>Tus horarios</h2><p class="sub">Los días y horas que marques son los que ve quien entra a tu página.</p>
    ${[1,2,3,4,5,6].map(d => { const x = c.days[d]; return `<div class="hrow"><label class="chk"><input type="checkbox" data-d="${d}" class="hOn" ${x.on?'checked':''}> ${cap(WD[d])}</label><select class="hF" data-d="${d}" aria-label="${WD[d]} desde">${hs.map(v => `<option ${v===x.from?'selected':''}>${v}</option>`).join('')}</select><select class="hT" data-d="${d}" aria-label="${WD[d]} hasta">${hs.map(v => `<option ${v===x.to?'selected':''}>${v}</option>`).join('')}</select></div>`; }).join('')}
    <div class="form"><div class="two"><div><label for="hS" style="margin-top:0">Un turno cada</label><select id="hS">${[[30,'30 minutos'],[45,'45 minutos'],[60,'1 hora'],[90,'1 hora y media']].map(([v,l]) => `<option value="${v}" ${v===c.step?'selected':''}>${l}</option>`).join('')}</select></div><div><label for="hD" style="margin-top:0">La sesión dura</label><select id="hD">${[30,40,45,50,60,90].map(v => `<option value="${v}" ${v===c.dur?'selected':''}>${v} minutos</option>`).join('')}</select></div></div>
    <button class="btn w gap" data-a="hsave">Guardar horarios</button></div></section>`; }
function viewMas(){ const c = S.cfg;
  return `<section class="sheet"><div class="form" style="border:0"><h3>Tus datos</h3>
    <label for="mN">Tu nombre</label><input id="mN" type="text" value="${esc(c.name)}"><label for="mR">Qué hacés</label><input id="mR" type="text" value="${esc(c.role)}">
    <label for="mW">Tu WhatsApp (ahí te llegan los pedidos)</label><input id="mW" type="tel" value="${esc(c.wa)}" placeholder="Ej.: 341 555 1234">
    <label>Cómo atendés</label>${['Presencial','Online'].map(m => `<label class="chk"><input type="checkbox" class="mM" value="${m}" ${c.modes.includes(m)?'checked':''}> ${m}</label>`).join('')}
    <label for="mP">Dónde atendés</label><textarea id="mP" rows="2">${esc(c.place)}</textarea><label for="mC">Aviso de cancelación</label><textarea id="mC" rows="2">${esc(c.cancel)}</textarea>
    <button class="btn w gap" data-a="msave">Guardar</button></div></section>
    ${DEMO?`<p class="note gap"><b>Esto es una muestra</b>Lo que cargues acá queda solo en este celular. En tu app, los turnos se guardan en una planilla de tu propia cuenta de Google.</p><button class="btn o w" data-a="reset">Volver a los datos de ejemplo</button>`:''}
    <button class="btn o w gap" data-a="out">Salir del panel</button>`; }
function calLink(t, date){ const s = day(date), m = mins(t.time), f = (mm) => date.replace(/-/g,'')+'T'+pad(Math.floor(mm/60))+pad(mm%60)+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Turno '+t.name)+'&dates='+f(m)+'/'+f(m+S.cfg.dur)+'&details='+encodeURIComponent(t.mode+'. WhatsApp: '+t.phone); }
function showMsg(t, title, text){ A.msg = {title, text, href:waLink(t.phone, text)}; }
function when(date){ const td = today(); return date===td ? 'de hoy' : date===iso(addDays(new Date(),1)) ? 'de mañana' : 'del '+shortDate(date); }

// ===== Acciones =====
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a, v = b.dataset.v, c = S.cfg;
  // página
  if(a==='mode'){ P.mode = v; renderSite(); }
  if(a==='day'){ P.date = v; P.time = null; renderSite(); }
  if(a==='time'){ P.time = v; renderSite(); const d = $('#datos'); if(d) d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'start'}); }
  if(a==='send'){ const name = $('#fN').value.trim(), phone = $('#fP').value.trim(); if(name.length<3){ toast('Falta tu nombre.'); $('#fN').focus(); return; } if(phone.replace(/\D/g,'').length<8){ toast('Revisá tu WhatsApp.'); $('#fP').focus(); return; }
    if(turnoAt(P.date,P.time)){ toast('Ese horario se acaba de ocupar. Elegí otro.'); P.time = null; renderSite(); return; }
    const t = {id:uid(), date:P.date, time:P.time, name, phone, mode:P.mode, first:$('#fF').checked, status:'pedido', weekly:false, skip:[]}; S.turnos.push(t); save(); P.last = t; P.step = 'done'; P.time = null; renderSite(); scrollTo(0,0);
    if(c.wa) location.href = waLink(c.wa, msgPedido(t)); }
  if(a==='again'){ P.step = 'pick'; P.last = null; renderSite(); }
  // panel
  if(a==='pin'){ if($('#pin').value.trim()==='1234'){ A.ok = true; renderPanel(); } else toast('Clave incorrecta.'); }
  if(a==='tab'){ A.tab = v; A.form = null; A.open = null; renderPanel(); }
  if(a==='pday'){ A.date = v; A.open = null; renderPanel(); }
  if(a==='open'){ A.open = A.open===v ? null : v; renderPanel(); }
  if(a==='new'){ const p = (v||'').split('|'); A.form = {date:p[0]||A.date, time:p[1]||''}; renderPanel(); scrollTo(0,0); }
  if(a==='ncancel'){ A.form = null; renderPanel(); }
  if(a==='nsave'){ const date = $('#nD').value, time = $('#nT').value, name = $('#nN').value.trim(), phone = $('#nP').value.trim(); if(!date || !time){ toast('Elegí día y hora.'); return; } if(name.length<2){ toast('Falta el nombre.'); return; }
    S.turnos.push({id:uid(), date, time, name, phone, mode:$('#nM')?$('#nM').value:c.modes[0], first:false, status:'confirmado', weekly:$('#nW').checked, skip:[]}); save(); A.form = null; A.date = date; renderPanel(); renderSite(); toast('Turno guardado.'); }
  if(a==='link'){ const u = location.href.split('#')[0]; try{ navigator.clipboard.writeText(u).then(() => toast('Link copiado. Pegalo en el chat.'), () => toast(u)); }catch(err){ toast(u); } }
  if(a==='conf' || a==='rem'){ const t = S.turnos.find(x => x.id===b.dataset.id); if(!t) return; const d = A.date;
    if(a==='conf'){ t.status = 'confirmado'; save(); showMsg(t, 'Mensaje de confirmación', `Hola ${t.name.split(' ')[0]}! Te confirmo el turno ${when(d)} a las ${t.time} (${t.mode.toLowerCase()}). ${c.cancel}`); }
    else showMsg(t, 'Recordatorio', `Hola ${t.name.split(' ')[0]}! Te recuerdo tu turno ${when(d)} a las ${t.time} (${t.mode.toLowerCase()}). Te espero.`);
    A.open = null; renderPanel(); scrollTo(0,0); }
  if(a==='msgx'){ A.msg = null; renderPanel(); }
  if(a==='skip'){ const t = S.turnos.find(x => x.id===b.dataset.id); if(t){ if(t.date===A.date){ const nx = iso(addDays(day(t.date),7)); t.date = nx; } else (t.skip = t.skip||[]).push(A.date); save(); A.open = null; renderPanel(); renderSite(); toast('Ese día quedó libre.'); } }
  if(a==='del'){ S.turnos = S.turnos.filter(x => x.id!==b.dataset.id); save(); A.open = null; renderPanel(); renderSite(); toast('Turno cancelado. El horario quedó libre.'); }
  if(a==='block'){ c.blockedSlots.push(v); save(); renderPanel(); renderSite(); }
  if(a==='unblock'){ c.blockedSlots = c.blockedSlots.filter(x => x!==v); save(); renderPanel(); renderSite(); }
  if(a==='blockday'){ c.blocked.push(A.date); save(); renderPanel(); renderSite(); toast('Día bloqueado.'); }
  if(a==='unblockday'){ c.blocked = c.blocked.filter(x => x!==A.date); save(); renderPanel(); renderSite(); }
  if(a==='hsave'){ let bad = false; document.querySelectorAll('.hOn').forEach(i => { const d = i.dataset.d, f = document.querySelector('.hF[data-d="'+d+'"]').value, t = document.querySelector('.hT[data-d="'+d+'"]').value; if(i.checked && mins(t)<=mins(f)) bad = true; c.days[d] = {on:i.checked, from:f, to:t}; });
    if(bad){ toast('Revisá: la hora de cierre tiene que ser después de la de inicio.'); return; } c.step = Number($('#hS').value); c.dur = Number($('#hD').value); save(); renderPanel(); renderSite(); toast('Horarios guardados.'); }
  if(a==='msave'){ const ms = [...document.querySelectorAll('.mM:checked')].map(i => i.value); if(!ms.length){ toast('Marcá al menos una forma de atender.'); return; } c.name = $('#mN').value.trim() || c.name; c.short = c.name.split(' ')[0]; c.mono = c.name.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase(); c.role = $('#mR').value.trim() || c.role; c.wa = $('#mW').value.trim(); c.modes = ms; c.place = $('#mP').value.trim(); c.cancel = $('#mC').value.trim(); save(); renderPanel(); renderSite(); toast('Guardado.'); }
  if(a==='reset'){ S = seed(); save(); A.date = today(); renderPanel(); renderSite(); toast('Datos de ejemplo restaurados.'); }
  if(a==='out'){ A.ok = false; location.hash = ''; }
});
document.addEventListener('change', e => { if(e.target.id==='nD' && A.form){ A.form.date = e.target.value; A.form.name = $('#nN').value; A.form.phone = $('#nP').value; renderPanel(); } });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='pin') $('[data-a="pin"]').click(); });

// ===== Arranque =====
function route(){ const p = location.hash==='#panel'; $('#site').hidden = p; $('#panel').hidden = !p; if(p) renderPanel(); else renderSite(); scrollTo(0,0); }
load(); addEventListener('hashchange', route); route();
</script>
</body>
</html>
