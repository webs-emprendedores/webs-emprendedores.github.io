<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A1A1A">
<title>Consultorio de muestra. Turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&family=Playfair+Display:wght@500;600&family=Jost:wght@500&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--paper:#fff;--ink:#14282E;--mut:#4B5F65;--line:#CBD6D8;--pet:#1E5661;--pet2:#17444D;--amb:#D9972B;--ambbg:#FBF1DC;--off:#7F9094;--red:#9B3B2E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:Literata,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 56px}
.mut{color:var(--mut)}

/* cabecera */
.top{display:flex;gap:14px;align-items:center;padding:26px 0 8px}
.mono{flex:none;width:56px;height:56px;border-radius:50%;background:var(--pet);color:#fff;display:grid;place-items:center;font:600 22px Literata,Georgia,serif;letter-spacing:.5px}
.pho{flex:none;width:76px;height:76px;border-radius:50%;object-fit:cover;display:block}
.tags{list-style:none;margin:-8px 0 22px;padding:0;border-top:1px solid var(--line)}
.tags li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.top h1{font-size:30px}
.top p{color:var(--mut);font-size:17px;margin-top:2px}
.lead{margin:10px 0 22px;font-size:19px}
/* LINKS v1 (17/11, prometido a Lucre): Instagram y dirección en la primera pantalla; solo si la profesional los cargó */
.lk{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin:-8px 0 22px}
.lk .btn.ig{gap:8px;min-height:48px}
.lead:empty+.lk{margin-top:18px}   /* LD y consultorios: sin presentación, no se pega a la línea de la cabecera */
.lk .ig svg,.lk .map svg{flex:none;width:22px;height:22px}
.lk .map{display:inline-flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:17px;line-height:1.35;text-decoration:underline;text-underline-offset:3px;min-height:48px;padding-top:10px;overflow-wrap:anywhere}
.lk .map svg{color:var(--pet);margin-top:-1px}

/* hoja de agenda */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet>h2{font-size:23px;padding:18px 16px 4px}
.sheet>.sub{padding:0 16px 14px;color:var(--mut);font-size:15px;font-weight:400;line-height:1.4}
.seg{display:flex;margin:0 16px 14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:#fff;font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.wk{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-top:1px solid var(--line)}.wk span{text-align:center;font-size:16px;color:var(--mut)}.wk button{min-height:48px;border:0;background:none;font-size:30px;line-height:1;color:var(--pet);cursor:pointer}.wk button:disabled{color:var(--off);cursor:default}
.days::-webkit-scrollbar{display:none}
.days button{min-width:0;min-height:74px;padding:8px 0 6px;border:0;border-right:1px solid var(--line);border-bottom:4px solid transparent;background:#fff;text-align:center;line-height:1.1}
.days button b{display:block;font:600 22px Literata,Georgia,serif;margin-top:3px}
.days button span{font-size:15px;color:var(--mut)}.days button:last-child{border-right:0}
.days button.on{background:var(--ambbg);border-bottom-color:var(--amb)}
.days button:disabled{cursor:default;color:var(--off);background:#F7F9F9}
.days button:disabled span,.days button:disabled b{color:var(--off)}
.daytitle{padding:14px 16px 10px;border-top:1px solid var(--line);font-weight:700}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;min-height:58px;padding:6px 16px;border-top:1px solid var(--line)}
.row .t{font-weight:700;font-size:21px}
.row .s{color:var(--pet);font-weight:700}
.row.off .t{color:var(--off);text-decoration:line-through}
.row.off .s{color:var(--off);font-weight:400}
.svh{margin:4px 16px 8px;font-size:19px}
.svl{display:grid;gap:8px;margin:0 16px 16px}
.sv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;width:100%;min-height:58px;padding:10px 14px;border:2px solid var(--line);border-radius:8px;background:#fff;text-align:left;color:var(--ink)}
.sv b{font-size:18px;line-height:1.25}.sv span{grid-column:1;color:var(--mut);font-size:16px}.sv em{grid-row:1/3;grid-column:2;font-style:normal;font-weight:700;font-size:18px;color:var(--pet)}
.sv.on{border-color:var(--amb);background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}
.sena{margin-top:4px;padding:14px 16px;border:2px solid var(--amb);border-radius:8px;background:var(--ambbg)}.sena p{margin:0 0 6px}.sena .al{font:600 22px Literata,Georgia,serif;word-break:break-all;margin:2px 0 10px}
p.pick.sena{margin-top:12px;padding:10px 12px;border:0}
.svr+.svr{border-top:1px solid var(--line)}
.row.sel{background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}
.row .who{font-weight:700;line-height:1.25}
.row .tag{display:block;font-weight:400;font-size:16px;color:var(--mut)}
.row .tag b{color:var(--red)}
.empty{padding:18px 16px;border-top:1px solid var(--line);color:var(--mut)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border:2px solid var(--pet);border-radius:8px;background:var(--pet);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn.w{width:100%}
.btn.o{background:#fff;color:var(--pet)}
.btn.sm{min-height:42px;padding:0 14px;font-size:17px}
.btn.del{background:#fff;color:var(--red);border-color:var(--red)}
.acts{display:grid;gap:8px;padding:4px 16px 16px;background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}

/* formularios */
.form{padding:16px;border-top:1px solid var(--line)}
.form h3{font-size:20px;margin-bottom:4px}
label{display:block;font-weight:700;margin:14px 0 5px}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;min-height:50px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--pet);outline:0}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:14px 0 0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--pet)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>div{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.back{margin:18px 0 0}
.sec{font-size:21px;margin:22px 0 8px}
.days button small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.days button:disabled small{color:var(--off)}
.opt{flex-direction:column;align-items:flex-start;justify-content:center;min-height:68px;padding:10px 16px;text-align:left;margin-top:10px}
.opt span{font-weight:400;color:var(--mut);font-size:16px}
.big{font-size:22px;font-weight:700;line-height:1.25}
.pick{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg);font-weight:700}
.gap{margin-top:16px}

/* pedido hecho */
.done{padding:22px 16px}
.done h2{font-size:26px}
.bubble{margin:10px 0 0;padding:12px 14px;border-radius:4px 14px 14px 14px;background:#E3F3E1;border:1px solid #BFDDBB;white-space:pre-line;font-size:17px;line-height:1.4}

/* info y pie */
.info{margin-top:26px}
.info h2{font-size:22px;margin-bottom:6px}
.info dl{margin:0}
.info dt{font-weight:700;margin-top:14px}
.info dd{margin:2px 0 0;color:var(--mut)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--mut)}

/* panel */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0 12px}
.ptop h1{font-size:25px}
.tabs{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:16px}
.tabs button{flex:1;min-height:46px;padding:0 2px;border:0;background:#fff;font-weight:700;font-size:16px}
.orow{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.orow.os2{display:block}.os2 .osl{display:flex;justify-content:space-between;align-items:center;gap:8px}.os2 .osc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin:2px 0 4px 30px}
.orow .chk{margin:0;font-weight:700}
.orow input[type=tel]{min-height:46px;padding:6px 8px}
.tabs button.on{background:var(--ink);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.note{margin:0 0 16px;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg)}
.note b{display:block}
.hint.priv{margin:10px 0 0}
.hint{font-size:15px;font-weight:400;line-height:1.4;color:var(--mut);margin:-6px 0 16px}
.req{padding:14px 16px;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.hrow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.hrow select{min-height:46px;padding:6px 8px}
.hrow .chk{margin:0;font-weight:700}
.hrow.h2{border-top:0;padding-top:0}.hrow.h2 .chk{font-weight:400;font-size:15px}.hrow.h2 select{visibility:hidden}.hrow.h2.on select{visibility:visible}.hrow.hid{display:none}
.durrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.durrow .btn{min-height:46px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* PLUS: bloqueado en gris pero legible (Dardo 15/11) */
.btn.lockb{background:#ececec;color:#4a4a4a;border:2px dashed #9a9a9a;box-shadow:none;display:flex;align-items:center;justify-content:center;gap:10px}
.ptag{font-size:13px;font-weight:800;letter-spacing:.08em;background:#4a4a4a;color:#fff;border-radius:6px;padding:3px 7px}
.plist{margin:10px 0 0;padding-left:22px;font-size:17px;line-height:1.5}.plist li{margin:4px 0}
.fap{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.fap:first-child{border-top:0}.fap .mut{grid-column:1}.fap .btn{grid-row:1 / span 2;grid-column:2}
</style>
<style>/*NOV v1*/
#nov{position:fixed;inset:0;z-index:90;background:rgba(20,20,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:16px}
#nov .nb{background:#fff;color:#1d1d1d;border-radius:16px;max-width:460px;width:100%;padding:22px 20px 18px;margin-top:max(12px,env(safe-area-inset-top));box-shadow:0 10px 40px rgba(0,0,0,.25);font-size:17px;line-height:1.45}
#nov h2{font-size:24px;line-height:1.15;margin:0 0 10px;color:#1d1d1d}
#nov ul{margin:0 0 12px;padding-left:20px}#nov li{margin:6px 0}
#nov .ok2{margin:0 0 16px;color:#3d3d3d}
#nov button{width:100%;min-height:52px;border:0;border-radius:12px;background:#1d1d1d;color:#fff;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
</style>

<style>
/* Consultorio de muestra: la marca manda. Papel cálido, tinta negra, una sola línea fina. */
:root{--bg:#EFEDEA;--paper:#FAF9F7;--ink:#1A1A1A;--mut:#55504B;--line:#CFCAC4;--pet:#1A1A1A;--pet2:#000;--amb:#7A6F63;--ambbg:#E6E1DA;--off:#8A847D}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:0}
.brand{padding:34px 0 6px;text-align:center}
.brand img{width:230px;height:auto;max-width:70%}
.brand.sm{padding:18px 0 4px}
.brand.sm img{width:118px}
.kick{font:500 14px/1.3 Jost,"Source Sans 3",sans-serif;letter-spacing:.28em;text-transform:uppercase;text-align:center;color:var(--ink);margin-top:14px}
.kick.l{text-align:left;font-size:13px;letter-spacing:.2em;color:var(--mut);margin-top:4px}
.lead.ctr{text-align:center;margin:6px 0 4px;font-size:18px;color:var(--mut)}
.sec{font-size:24px;margin:30px 0 12px;padding-top:22px;border-top:1px solid var(--ink)}
#panel .sec{font-size:21px;margin:22px 0 8px;padding-top:0;border-top:0}
.sheet{border-radius:3px}
.btn{border-radius:3px;letter-spacing:.01em}
input,select,textarea{border-radius:3px!important}
.pro{display:grid;grid-template-columns:76px 1fr;column-gap:16px;row-gap:16px;padding:18px 16px;margin-bottom:14px;align-items:start}
.pro .pin{min-width:0}
.pro h3{font-size:23px}
.pro .tags{margin:10px 0 0;border-top:1px solid var(--line)}
.pro .tags li{font-size:16px;padding:7px 0}
.pro .btn{grid-column:1/-1}
.pho,.mono{width:76px;height:76px}
.pho{box-shadow:0 0 0 1px var(--paper),0 0 0 2px var(--ink)}
.mono{background:var(--paper);color:var(--ink);border:1px solid var(--ink);font:500 38px "Playfair Display",Georgia,serif;letter-spacing:0}
.top{gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--ink)}
.top h1{font-size:27px}
.top p{font:500 13px/1.3 Jost,"Source Sans 3",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-top:5px}
.lead:empty{display:none}
.top+.lead:empty+.tags,.top+.tags{margin-top:0}
.tags{margin:0 0 24px;border-top:0;display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.pro .tags{display:block}
.tags li{font-size:16px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.who{justify-content:flex-start;gap:14px;min-height:84px;margin-top:10px;font-size:20px;font-family:"Playfair Display",Georgia,serif;font-weight:600}
.who .s{width:56px;height:56px;font-size:28px}
/* portada: entra entera en la pantalla del celular */
.wrap:has(.cover){padding-bottom:0}
.cover{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:14px 0 12px}
.lg{position:relative;overflow:hidden;aspect-ratio:609/359;height:clamp(84px,21svh,190px);margin:0 auto;max-width:78%}
.lg i,.lg div{position:absolute;inset:0;display:block}
.lg .hf,.lg .cl i,.lg .ln,.lg .wd{animation:6s infinite alternate;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.lg .ln{left:49.33%;right:auto;width:.3%;min-width:1.4px;background:#1a1a1a;animation-name:lgLn}
.lg .cl.l{clip-path:inset(0 50.75% 0 0)}
.lg .cl.d{clip-path:inset(0 0 0 49.75%)}
.lg .cl i{background:none 0 0/100% 100% no-repeat;animation-name:lgL}
.lg .cl.d i{background-image:none;animation-name:lgDd}
.lg .hf.t{clip-path:inset(0 0 58.22% 0);animation-name:lgT}
.lg .hf.b{clip-path:inset(59.89% 0 0 0);animation-name:lgB}
.lg .wd{background:none 0 0/100% 100% no-repeat;animation-name:lgW}
@keyframes lgLn{0%{opacity:0;transform:scaleY(.014)}4%{opacity:1;transform:scaleY(.014)}20%,100%{opacity:1;transform:scaleY(1)}}
@keyframes lgL{0%,22%{transform:translateX(42%)}48%,100%{transform:none}}
@keyframes lgDd{0%,22%{transform:translateX(-46%)}48%,100%{transform:none}}
@keyframes lgT{0%,54%{clip-path:inset(0 0 48.4% 0)}66%,100%{clip-path:inset(0 0 58.22% 0)}}
@keyframes lgB{0%,54%{clip-path:inset(50% 0 0 0)}66%,100%{clip-path:inset(59.89% 0 0 0)}}
@keyframes lgW{0%,66%{opacity:0}78%,100%{opacity:1}}
.lg.sm{height:104px;margin:16px auto 4px}
.lg.sm *{animation-delay:var(--ld,0s)!important}
@media (prefers-reduced-motion:reduce){.lg *{animation:none!important}}
.cover .kick{margin-top:0}
.cover .lead.ctr{margin:4px 0 0;font-size:17px}
.cq{font-size:20px;text-align:center;margin-bottom:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pro2{padding:12px;display:flex;flex-direction:column;align-items:stretch;gap:8px;min-width:0}
.pro2 .hd{display:flex;align-items:center;gap:10px;min-width:0}
.pro2 .pho,.pro2 .mono{width:48px;height:48px;flex:none}
.pro2 .mono{font-size:25px}
.pro2 h3{font-size:18px;line-height:1.15;min-width:0}
.sp{list-style:none;margin:0;padding:0;font-size:15px;line-height:1.25;color:var(--mut)}
.sp li{padding:4px 0;border-top:1px solid var(--line)}
.pro2 .btn{min-height:46px;padding:0 8px;margin-top:auto}
.addr{text-align:center;color:var(--mut);font-size:15px}
.fot{display:flex;gap:14px;align-items:center}
.fot .btn{display:inline-flex;align-items:center;cursor:pointer}
.orow.tg{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.tgi{font-size:17px;min-width:0}
.av{padding:16px;margin-bottom:14px}
.av h3{font-size:22px}
.av .bubble{margin:12px 0 16px}
#site>.back,#panel>.back{margin-top:6px}
</style>
<style>/*COB v1*/
#cobB{margin:0;padding:14px 16px;background:#fff3cd;color:#3d2f00;font-size:17px;line-height:1.4;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#cobB.p{background:#fde8e6;color:#5c1410}
#cobS{margin:0;padding:8px 16px;background:#f4f4f2;color:#4a4a4a;font-size:14px;line-height:1.3;text-align:center}
#cobB b{font-weight:700}#cobB span{flex:1 1 200px}
#cobB button{min-height:48px;padding:0 16px;border:0;border-radius:10px;background:#1d1d1d;color:#fff;font:inherit;font-weight:700;cursor:pointer}
#cobL{display:block;width:calc(100% - 32px);max-width:560px;margin:24px auto 40px;min-height:52px;border:2px solid #4a4a4a;border-radius:12px;background:#fff;color:#1d1d1d;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
#cobD,#cobP{position:fixed;inset:0;z-index:95;background:rgba(20,20,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
#cobP{background:#f4f4f2;align-items:center}
#cobD .cb,#cobP .cb{background:#fff;color:#1d1d1d;border-radius:16px;max-width:460px;width:100%;padding:22px 20px 18px;margin-top:max(12px,env(safe-area-inset-top));box-shadow:0 10px 40px rgba(0,0,0,.25);font-size:17px;line-height:1.45}

<body>
<div class="wrap">
  <div id="site"></div>
  <div id="panel" hidden></div>
</div>
<div id="toast" role="status"></div>

<script>
/*COB v1*/ (function(){ const TIPO = 'turnos', F = window.fetch.bind(window); let G = null, PUB = null, PAGO = '';
  { const m = location.hash.match(/&pago=(ok|error|pendiente)/); if(m){ PAGO = m[1]; location.hash = location.hash.replace(/&pago=\w+/, ''); } }
  const el = id => document.getElementById(id), money = n => '$' + Number(n).toLocaleString('es-AR'), dm = s => { const p = String(s).split('-'); return Number(p[2]) + '/' + Number(p[1]); };
  const say = m => { try{ toast(m); }catch(e){ alert(m); } };
  const panel = () => el('app') || el('panel'), inPanel = () => { const p = panel(); return !!p && !p.hidden && p.getClientRects().length > 0; };
  const PLUSN = {ficha:'Gestión de pacientes'};
  const LEE = ['all','pub','payLink','payCheck','export','setPin','order'];   /* en pausa el panel no escribe nada (order lo frena el servidor) */
  const pausa = () => !!(G && G.bill && G.bill.estado==='pausa');
  window.fetch = async function(u, o){ let q = null; try{ q = JSON.parse(o && o.body); }catch(e){}
    if(q && q.a && q.pin && pausa() && !LEE.includes(q.a)){ setTimeout(() => { say('Tu app está en pausa: para cargar o cambiar algo, pagá y se reactiva.'); try{ pullAll().then(() => { try{ renderPanel(); }catch(e){} }); }catch(e){} }, 0);
      return new Response(JSON.stringify({ok:false, pausa:true, msg:'Tu app está en pausa: para cargar o cambiar algo, pagá y se reactiva.'}), {status:200, headers:{'Content-Type':'application/json'}}); }
    const r = await F(u, o);
    if(q && q.a && r.ok){ try{ const j = await r.clone().json();
      if((q.a==='all' || q.a==='payCheck') && j.ok && j.bill){ const first = !G; G = {bill:j.bill, pin:q.pin, c:q.c, url:u, data: q.a==='all' ? j : (G && G.data) || null}; try{ BILL = j.bill; }catch(e){} [0, 300, 1200].forEach(ms => setTimeout(paint, ms)); if(first) setTimeout(back, 350); }   /* el panel puede mostrarse un instante después de la respuesta */
      if(q.a==='pub' && j.ok){ const x = (j.settings && j.settings.extra) || {}; let w = x.wa || (x.cfg && x.cfg.wa) || ''; if(!w){ try{ w = WA; }catch(e){} } PUB = {pausa:!!j.pausa, wa:String(w||'').replace(/\D/g,'')}; setTimeout(pub, 0); }
      if(q.a==='order' && j.pausa){ PUB = Object.assign({wa:''}, PUB, {pausa:true}); setTimeout(pub, 0); }
    }catch(e){} } return r; };
  function msg(b){ const d = b.dias;
    if(b.estado==='pausa'){ const u = ultima(); return ['p', '<b>Tu app está en pausa.</b> No entran ' + TIPO + ' nuevos y no se puede cargar nada. ' + (u ? 'Ves lo agendado hasta el ' + dm(u) + '; después, para entrar, hay que pagar.' : '')]; }
    if(b.estado==='prueba_vence') return ['', d<=0 ? '<b>Tu prueba vence hoy.</b>' : '<b>Tu prueba vence mañana.</b>'];
    if(b.estado==='por_vencer') return ['', d<=0 ? '<b>Tu mensualidad vence hoy.</b>' : '<b>Tu mensualidad vence el ' + dm(b.pagado_hasta) + '.</b>'];
    if(b.estado==='vencido') return ['', '<b>Tu mensualidad venció el ' + dm(b.pagado_hasta) + '.</b> Pagala para que tu app no se pause.'];
    return null; }
  function paint(){ ['cobB','cobS','cobL'].forEach(i => { const e = el(i); if(e) e.remove(); }); if(!G || !G.bill.plan || !inPanel()) return; const p = panel(), m = msg(G.bill);
    document.documentElement.classList.toggle('cobSin', sinAcceso());
    if(sinAcceso()){ if(!el('cobD')) open(); return; }
    if(m){ const b = document.createElement('div'); b.id = 'cobB'; b.className = m[0]; b.setAttribute('role','status'); const pz = G.bill.estado==='pausa';
      b.innerHTML = '<span>' + m[1] + '</span><span class="bt2"><button type="button" data-k="pay">' + (pz ? 'Pagar y reactivar' : 'Ver cómo pagar') + '</button>' + (pz ? '<button type="button" class="o" data-k="dl">Descargar mis datos</button>' : '') + '</span>';
      p.parentNode.insertBefore(b, p); b.querySelector('[data-k="pay"]').onclick = open; const dl = b.querySelector('[data-k="dl"]'); if(dl) dl.onclick = baja; }
    else if(G.bill.estado==='prueba' && G.bill.dias > 0){ const s = document.createElement('p'); s.id = 'cobS'; s.textContent = 'Te quedan ' + G.bill.dias + ' días de prueba.'; p.parentNode.insertBefore(s, p); }   /* Dardo 16/11: días de prueba que quedan, en letra chica */
    const l = document.createElement('button'); l.id = 'cobL'; l.type = 'button'; l.textContent = 'Tu plan y pagos'; l.onclick = open; p.parentNode.insertBefore(l, p.nextSibling);
    if(G.bill.estado==='pausa'){ let seen = false; try{ seen = sessionStorage.getItem('cob_p')==='1'; sessionStorage.setItem('cob_p','1'); }catch(e){} if(!seen) open(); } }
  const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  function ultima(){ if(!G) return ''; if(G.bill.ultima) return G.bill.ultima; const o = (G.data && G.data.orders) || []; return o.map(x => String(x.date||'').slice(0,10)).filter(x => /^\d{4}-\d\d-\d\d$/.test(x)).sort().pop() || ''; }
  const sinAcceso = () => pausa() && (G.bill.acceso === false || !ultima() || ultima() < hoy());   /* pasó la última fecha agendada: solo la pantalla de pausa */
  async function baja(){ let d = G && G.data;
    if(!d || !d.orders){ try{ d = await (await F(G.url, {method:'POST', body:JSON.stringify({a:'export', c:G.c, pin:G.pin})})).json(); }catch(e){ d = null; } }
    if(!d || !d.ok){ say('No se pudieron bajar los datos. Probá de nuevo en un rato.'); return; }
    const cell = v => { v = v==null ? '' : typeof v==='object' ? JSON.stringify(v) : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
    const tabla = (t, rows) => { rows = rows || []; const k = [...new Set(rows.flatMap(r => Object.keys(r)))]; return t + '\n' + k.join(';') + '\n' + rows.map(r => k.map(x => cell(r[x])).join(';')).join('\n'); };
    const csv = '\ufeff' + tabla(TIPO==='turnos' ? 'Turnos' : 'Pedidos', d.orders) + '\n\n' + tabla('Productos', d.products);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = (G.c || 'mis-datos') + '-' + hoy() + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function open(){ if(!G || el('cobD')) return; const b = G.bill, pr = b.precios || {}, bt = [];
    let st = b.pagado_hasta ? 'Pagado hasta el ' + dm(b.pagado_hasta) + '.' : b.prueba_hasta ? 'Prueba gratis hasta el ' + dm(b.prueba_hasta) + '.' : '';
    if(b.estado==='pausa') st = sinAcceso() ? 'Ya no hay ' + TIPO + ' agendados por delante. Tus datos están guardados: al pagar, vuelve todo enseguida.' : 'Tus ' + TIPO + ' y tus datos no se tocaron. Al pagar, vuelve a funcionar enseguida.';
    if(b.mp){ if(pr.mes) bt.push(['mes', 'Pagar un mes: ' + money(pr.mes), '']); if(pr.seis) bt.push(['seis', 'Pagar 6 meses adelantados: ' + money(pr.seis), b.seis_pagas ? 'Pagás ' + b.seis_pagas + ' meses y usás 6' : '']); }   /* PRECIOS UNIFICADOS (Dardo 16/11 17:50): solo mes y 6 meses; lo viejo que mande el servidor no se ofrece */
    const pl = TIPO==='pedidos' ? [] : (b.plus||[]).map(k => PLUSN[k] || k),   /* el Plus es solo para profesionales */ d = document.createElement('div'); d.id = 'cobD'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-labelledby','cobT');
    d.innerHTML = '<div class="cb"><h2 id="cobT">' + (b.estado==='pausa' ? 'Tu app está en pausa' : 'Tu plan y pagos') + '</h2>' + (st ? '<p>' + st + '</p>' : '') + (pl.length ? '<p class="mu">Plus activados: ' + pl.join(', ') + '.</p>' : '')
      + (bt.length && !b.pagado_hasta && b.prueba_hasta && b.estado!=='pausa' ? '<p>Si pagás ahora no perdés días: lo que pagás empieza a contar cuando termina la prueba.</p>' : '')
      + (bt.length ? '<p class="mu">Se paga con Mercado Pago y queda registrado solo.</p>' : '<p class="mu">Para pagar, escribinos a @webs.emprendedores por Instagram.</p>')
      + bt.map(x => '<button type="button" data-cob="' + x[0] + '">' + (b.estado==='pausa' ? 'Pagar y reactivar ' + x[1].replace(/^Pagar /, '') : x[1]) + (x[2] ? '<small>' + x[2] + '</small>' : '') + '</button>').join('')
      + (b.estado==='pausa' ? '<button type="button" class="o" data-cob="dl">Descargar mis datos</button>' : '') + (sinAcceso() ? '' : '<button type="button" class="o" data-cob="x">Cerrar</button>') + '</div>';
    document.body.appendChild(d); d.addEventListener('click', e => { const t = e.target.closest('[data-cob]'); if(!t) return; if(t.dataset.cob==='x'){ d.remove(); return; } if(t.dataset.cob==='dl'){ baja(); return; } pay(t.dataset.cob, t); }); d.querySelector('[data-cob]').focus(); }
  async function pay(item, btn){ btn.disabled = true;
    try{ const r = await (await F(G.url, {method:'POST', body:JSON.stringify({a:'payLink', c:G.c, pin:G.pin, item, back:location.origin + location.pathname + (location.hash.split('&')[0] || '#panel')})})).json();
      if(r.ok && r.url){ location.href = r.url; return; } say(r.msg || 'No se pudo armar el pago. Probá de nuevo en un rato.'); }catch(e){ say('No hay conexión. Probá de nuevo.'); } btn.disabled = false; }
  async function back(){ if(!PAGO || !G) return; const p = PAGO; PAGO = ''; if(p==='error'){ say('El pago no se completó. Podés probar de nuevo cuando quieras.'); return; }
    const antes = JSON.stringify([G.bill.pagado_hasta, G.bill.plus, G.bill.cuotas, G.bill.entrada]);
    try{ await (await fetch(G.url, {method:'POST', body:JSON.stringify({a:'payCheck', c:G.c, pin:G.pin})})).json(); }catch(e){ return; }

function diasTxt(ds){ const n = ds.map(d => ORD.indexOf(d)); if(ds.length>=3 && n.every((v,i) => !i || v===n[i-1]+1)) return WD[ds[0]]+' a '+WD[ds[ds.length-1]]; const w = ds.map(d => WD[d]); return w.length>1 ? w.slice(0,-1).join(', ')+' y '+w[w.length-1] : w[0]; }
function agendaTxt(c){ const g = {}; agenda(c).forEach(x => { const k = x.am && x.pm ? 'de mañana y de tarde' : x.am ? 'por la mañana' : 'por la tarde'; (g[k] = g[k]||[]).push(x.d); });
  return ['por la mañana','por la tarde','de mañana y de tarde'].filter(k => g[k]).map(k => cap(diasTxt(g[k]))+' '+k+'.').join(' '); }
function cuandoOpts(c){ const o = []; agenda(c).forEach(x => { if(x.am) o.push({k:'d'+x.d+'am', l:cap(WD[x.d])+' por la mañana'}); if(x.pm) o.push({k:'d'+x.d+'pm', l:cap(WD[x.d])+' por la tarde'}); }); return o; }
function franjas(c){ const on = Object.values(c.days||{}).filter(d => d && d.on); return {am: on.some(d => d.from < '13:00'), pm: on.some(d => d.to > '13:00')}; }

  : {id:x.id, created:x.created||today(), date:x.date, product:LBL[x.status==='sena'?'pedido':x.status]||LBL.confirmado, people:x.age||'', fill:x.time, delivery:x.cov||'', name:x.name, phone:x.phone||'', notes:[line('Seña pendiente',x.status==='sena'&&x.sena?x.sena:''), line('Servicio',x.serv), line('Motivo',x.motivo), line('Con dolor',x.pain), line('Semanas liberadas',(x.skip||[]).join(', ')), line('Duración',x.dur?x.dur+' min':'')].filter(Boolean).join('\n'), pay:'sin', total:0, paid:0, done:!!x.weekly}; }
function fromOrders(list){ const turnos = [], reqs = [], fichas = [];
  list.forEach(o => { if(o.product==='Ficha'){ fichas.push(Object.assign({id:o.id, created:o.created, name:o.name, phone:o.phone, date:o.date, what:pick(o.notes,'Qué'), det:pick(o.notes,'Detalle'), next:o.fill||''}, (() => { try{ return JSON.parse(pick(o.notes,'Datos')||'{}'); }catch(e){ return {}; } })())); return; } const base = {id:o.id, created:o.created, name:o.name, phone:o.phone, age:Number(o.people)||0, cov:o.delivery, motivo:pick(o.notes,'Motivo'), pain:pick(o.notes,'Con dolor')}, sv0 = (S.cfg.serv||[]).find(v => v.n===pick(o.notes,'Servicio')); if(sv0) Object.assign(base, {serv:sv0.n, price:sv0.p, sdur:sv0.d});   /* SERVICIOS 17/11: el servicio viaja en las notas */
    if(o.product==='Pedido nuevo') reqs.push(Object.assign(base, {avail:pick(o.notes,'Puede'), dur:base.sdur||0}));
    else { const sn = Number(pick(o.notes,'Seña pendiente'))||0, st = sn ? 'sena' : Object.keys(LBL).find(k => LBL[k]===o.product) || 'confirmado';   /* SEÑA 17/11: va como Turno por confirmar + nota (el servidor ya lo cuenta como ocupado) */ if(sn) base.sena = sn; const sk = pick(o.notes,'Semanas liberadas');
      turnos.push(Object.assign(base, {date:o.date, time:o.fill, mode:'Presencial', kind:st==='consulta'?'consulta':'paciente', status:st, weekly:!!o.done, skip:sk?sk.split(', '):[], dur:parseInt(pick(o.notes,'Duración'),10)||0})); } });
  return {turnos, reqs, fichas}; }

let RETRY = null; function pend(on){ pendStore();  let b = $('#pend'); if(on && !b){ b = document.createElement('div'); b.id = 'pend'; b.setAttribute('role','status'); b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:60;padding:12px 16px;background:#8a1c1c;color:#fff;font-weight:700;font-size:16px;line-height:1.35;text-align:center'; b.textContent = 'Sin conexión: hay cambios sin guardar. No cierres la app; se guardan solos cuando vuelva la señal.'; document.body.appendChild(b); } if(!on && b){ b.remove(); toast('Listo, quedó todo guardado.'); } clearTimeout(RETRY); if(on) RETRY = setTimeout(() => { if(A.ok && dirty()) save(); else pend(false); }, 8000); }
function save(){ if(!S || !A.ok || !SNAP) return; const prev = SNAP, now = snapOf(), up = [], del = [];
  Object.keys(now.m).forEach(id => { if(now.m[id]!==SNAP.m[id]) up.push(JSON.parse(now.m[id])); });
  Object.keys(SNAP.m).forEach(id => { if(!(id in now.m)) del.push(id); });
  const cfgCh = now.cfg!==SNAP.cfg; SNAP = now; if(!up.length && !del.length && !cfgCh) return;
  const pin = A.pin, cfg = JSON.parse(now.cfg);
  QUEUE = QUEUE.then(async () => { try{
      if(up.length){ const r = await api({a:'saveOrders', pin, orders:up}); if(!r.ok) throw 0; }
      if(del.length){ const r = await api({a:'delOrders', pin, ids:del}); if(!r.ok) throw 0; }
      if(cfgCh){ const r = await api({a:'saveSettings', pin, settings:{maxPerDay:9999, blocked:[], spOn:false, senaPct:0, extra:{kind:'turnos', cfg}}}); if(!r.ok) throw 0; }
      if($('#pend') && !dirty()) pend(false); else pendStore();
    }catch(e){ /* lo que no se pudo guardar vuelve a quedar como pendiente y se reintenta solo */
      up.forEach(o => { if(o.id in prev.m) SNAP.m[o.id] = prev.m[o.id]; else delete SNAP.m[o.id]; }); del.forEach(id => { SNAP.m[id] = prev.m[id]; }); if(cfgCh) SNAP.cfg = prev.cfg;
      if(!$('#pend')) toast('No se pudo guardar. Se reintenta solo.'); pend(true); } });
}

      /* recordatorios: se borran si el turno se canceló (marca __anular) o si ya pasó la hora del turno */ const now = nowStamp(), mk = AVL.filter(o => o.delivery===ANUL);
      const gone = AVL.filter(o => o.delivery!==ANUL && o.delivery.indexOf('Aviso para ')!==0 && ((o.delivery===REM && (String(o.fill).split('|')[1]||'') < now) || mk.some(m => m.name===o.name && m.phone===o.phone && m.product===o.product && m.id>o.id && (m.fill==='ALL' ? o.delivery===REM : m.fill===String(o.fill).split('|')[1])))).map(o => o.id).concat(mk.map(o => o.id));

<script>/*CONS v1*/
