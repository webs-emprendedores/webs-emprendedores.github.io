<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E5661">
<title>Andrea Colman, psicóloga. Turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--paper:#fff;--ink:#14282E;--mut:#4B5F65;--line:#CBD6D8;--pet:#1E5661;--pet2:#17444D;--amb:#D9972B;--ambbg:#FBF1DC;--off:#7F9094;--red:#9B3B2E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:Literata,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 56px}
.mut{color:var(--mut)}

/* cabecera */
.top{display:flex;gap:14px;align-items:center;padding:26px 0 8px}
.mono{flex:none;width:56px;height:56px;border-radius:50%;background:var(--pet);color:#fff;display:grid;place-items:center;font:600 22px Literata,Georgia,serif;letter-spacing:.5px}
.pho{flex:none;width:76px;height:76px;border-radius:50%;object-fit:cover;display:block}
.tags{list-style:none;margin:-8px 0 22px;padding:0;border-top:1px solid var(--line)}
.tags li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.top h1{font-size:30px}
.top p{color:var(--mut);font-size:17px;margin-top:2px}
.lead{margin:10px 0 22px;font-size:19px}

/* hoja de agenda */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet>h2{font-size:23px;padding:18px 16px 4px}
.sheet>.sub{padding:0 16px 14px;color:var(--mut);font-size:17px}
.seg{display:flex;margin:0 16px 14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:#fff;font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.days{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:66px;min-height:74px;padding:8px 0 6px;border:0;border-right:1px solid var(--line);border-bottom:4px solid transparent;background:#fff;text-align:center;line-height:1.1}
.days button b{display:block;font:600 25px Literata,Georgia,serif;margin-top:3px}
.days button span{font-size:16px;color:var(--mut)}
.days button.on{background:var(--ambbg);border-bottom-color:var(--amb)}
.days button:disabled{cursor:default;color:var(--off);background:#F7F9F9}
.days button:disabled span,.days button:disabled b{color:var(--off)}
.daytitle{padding:14px 16px 10px;border-top:1px solid var(--line);font-weight:700}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;min-height:58px;padding:6px 16px;border-top:1px solid var(--line)}
.row .t{font-weight:700;font-size:21px}
.row .s{color:var(--pet);font-weight:700}
.row.off .t{color:var(--off);text-decoration:line-through}
.row.off .s{color:var(--off);font-weight:400}
.row.sel{background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}
.row .who{font-weight:700;line-height:1.25}
.row .tag{display:block;font-weight:400;font-size:16px;color:var(--mut)}
.row .tag b{color:var(--red)}
.empty{padding:18px 16px;border-top:1px solid var(--line);color:var(--mut)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border:2px solid var(--pet);border-radius:8px;background:var(--pet);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn.w{width:100%}
.btn.o{background:#fff;color:var(--pet)}
.btn.sm{min-height:42px;padding:0 14px;font-size:17px}
.btn.del{background:#fff;color:var(--red);border-color:var(--red)}
.acts{display:grid;gap:8px;padding:4px 16px 16px;background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}

/* formularios */
.form{padding:16px;border-top:1px solid var(--line)}
.form h3{font-size:20px;margin-bottom:4px}
label{display:block;font-weight:700;margin:14px 0 5px}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;min-height:50px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--pet);outline:0}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:14px 0 0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--pet)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>div{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.back{margin:18px 0 0}
.sec{font-size:21px;margin:22px 0 8px}
.days button small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.days button:disabled small{color:var(--off)}
.opt{flex-direction:column;align-items:flex-start;justify-content:center;min-height:68px;padding:10px 16px;text-align:left;margin-top:10px}
.opt span{font-weight:400;color:var(--mut);font-size:16px}
.big{font-size:22px;font-weight:700;line-height:1.25}
.pick{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg);font-weight:700}
.gap{margin-top:16px}

/* pedido hecho */
.done{padding:22px 16px}
.done h2{font-size:26px}
.bubble{margin:10px 0 0;padding:12px 14px;border-radius:4px 14px 14px 14px;background:#E3F3E1;border:1px solid #BFDDBB;white-space:pre-line;font-size:17px;line-height:1.4}

/* info y pie */
.info{margin-top:26px}
.info h2{font-size:22px;margin-bottom:6px}
.info dl{margin:0}
.info dt{font-weight:700;margin-top:14px}
.info dd{margin:2px 0 0;color:var(--mut)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--mut)}

/* panel */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0 12px}
.ptop h1{font-size:25px}
.tabs{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:16px}
.tabs button{flex:1;min-height:46px;padding:0 2px;border:0;background:#fff;font-weight:700;font-size:16px}
.orow{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.orow.os2{display:block}.os2 .osl{display:flex;justify-content:space-between;align-items:center;gap:8px}.os2 .osc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin:2px 0 4px 30px}
.orow .chk{margin:0;font-weight:700}
.orow input[type=tel]{min-height:46px;padding:6px 8px}
.tabs button.on{background:var(--ink);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.note{margin:0 0 16px;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg)}
.note b{display:block}
.hint{font-size:16px;color:var(--mut);margin:-6px 0 16px}
.req{padding:14px 16px;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.hrow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.hrow select{min-height:46px;padding:6px 8px}
.hrow .chk{margin:0;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<style>/*NOV v1*/
#nov{position:fixed;inset:0;z-index:90;background:rgba(20,20,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:16px}
#nov .nb{background:#fff;color:#1d1d1d;border-radius:16px;max-width:460px;width:100%;padding:22px 20px 18px;margin-top:max(12px,env(safe-area-inset-top));box-shadow:0 10px 40px rgba(0,0,0,.25);font-size:17px;line-height:1.45}
#nov h2{font-size:24px;line-height:1.15;margin:0 0 10px;color:#1d1d1d}
#nov ul{margin:0 0 12px;padding-left:20px}#nov li{margin:6px 0}
#nov .ok2{margin:0 0 16px;color:#3d3d3d}
#nov button{width:100%;min-height:52px;border:0;border-radius:12px;background:#1d1d1d;color:#fff;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
</style>
<style>
.byw{margin:6px 0 0;font-size:15px}
.byw a{color:var(--off);text-decoration:none}
.fot{display:flex;gap:14px;align-items:center}
.fot .btn{display:inline-flex;align-items:center;cursor:pointer}
.quick a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="site"></div>
  <div id="panel" hidden></div>
</div>
<div id="toast" role="status"></div>

<script>
// ===== Datos del profesional (se adaptan a cada cliente) =====
const DEMO = false;                 // muestra: nada sale de este celular
const KEY = 'turnos_andreacolman_func_v1';
const RUBRO = 'psi';               // rubro: 'psi' (psicólogos y afines) u 'odo' (odontólogos y afines). Una sola plantilla para los dos: lo común no se desfasa
const RW = RUBRO==='odo' ? {ses:'consulta', Ses:'Consulta', dura:'El turno dura'} : {ses:'sesión', Ses:'Sesión', dura:'La sesión dura'};
const DEFAULT = {
  name:'Daniela Paz', short:'Daniela', role:'Psicóloga', mono:'DP',
  lead:'Atiendo a adultos, en consultorio en Rosario y por videollamada.',
  wa:'', modes:['Presencial','Online'], place:'Zona centro, Rosario. La dirección exacta te llega al confirmar.',
  dur:50, step:60, cancel:'Si no podés venir, avisame con 24 horas de anticipación.', fees:{part:30000, show:true, partOn:true},
  os:[],          // obras sociales: arranca VACÍA, la carga el profesional (Dardo 15/11 18:34)
  days:{1:{on:true,from:'14:00',to:'20:00'},2:{on:true,from:'14:00',to:'20:00'},3:{on:true,from:'09:00',to:'13:00'},4:{on:true,from:'14:00',to:'20:00'},5:{on:true,from:'09:00',to:'13:00'},6:{on:false,from:'09:00',to:'12:00'}},
  blocked:[], blockedSlots:[],
  selfPick:true,   // true: quien entra elige un horario libre. false: deja sus datos y el profesional le da el turno
  osOther:true,    // el paciente puede escribir otra obra social que no está en la lista ("Otra")
  q2:'',           // pregunta extra de Sí o No (ej.: Estás con dolor?). Vacía: no se pregunta
  ask:{age:true, motivo:true, pain:false},   // pain: pregunta si está con dolor (odontología)
  call:false,      // true: antes de dar el turno, el profesional llama por teléfono
  lic:'',          // matrícula
  title:'',        // título (Lic., Dra.): lo elige el profesional; el nombre no se cambia desde el panel
  photo:'',        // foto del profesional (archivo al lado del index); si está vacío va el monograma
  tags:[]          // especialidades o servicios, se listan bajo la presentación
};
Object.assign(DEFAULT, {"name": "Andrea Colman", "short": "Andrea", "role": "Psicóloga", "mono": "AC", "lead": "Atención psicológica.", "modes": ["Presencial"], "place": "", "cancel": "", "fees": {"part": 0, "show": true}, "os": [], "selfPick": false, "days": {"1": {"on": true, "from": "14:00", "to": "20:00"}, "2": {"on": true, "from": "14:00", "to": "20:00"}, "3": {"on": true, "from": "14:00", "to": "20:00"}, "4": {"on": true, "from": "14:00", "to": "20:00"}, "5": {"on": true, "from": "14:00", "to": "20:00"}, "6": {"on": false, "from": "14:00", "to": "20:00"}}, "osOther": true, "photo": "perfil.png"});
const CLIENT = 'andreacolman';
const WD = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const WD3 = ['dom','lun','mar','mié','jue','vie','sáb'];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// ===== Utilidades =====
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const day = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => iso(new Date());
const longDate = s => { const d = day(s); return WD[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]; };
const shortDate = s => { const d = day(s); return WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1); };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const money = n => '$'+Number(n||0).toLocaleString('es-AR');
const mins = t => { const p = t.split(':').map(Number); return p[0]*60+p[1]; };
const hhmm = m => pad(Math.floor(m/60))+':'+pad(m%60);
const uid = () => 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let toastT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function waNum(p){ let n = String(p||'').replace(/\D/g,''); if(!n) return ''; if(!n.startsWith('54')) n = '549'+n.replace(/^0/,''); return n; }
const waLink = (p,txt) => 'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(txt);
const modeTxt = t => S.cfg.modes.length>1 && t.mode ? ` (${t.mode.toLowerCase()})` : '';

// ===== Estado (en la muestra vive solo en este celular) =====
function seed(){
  const base = new Date(), mon = addDays(base, -((base.getDay()+6)%7));
  const w = (off,time,name,phone,mode,cov) => ({id:uid(), date:iso(addDays(mon,off)), time, name, phone, mode, cov, kind:'paciente', status:'confirmado', weekly:true, skip:[], demo:true});
  const turnos = [ w(0,'15:00','Marcela R.','341 555 0101','Presencial','IAPOS'), w(0,'18:00','Tomás G.','341 555 0102','Online','Particular'), w(1,'16:00','Lucía F.','341 555 0103','Presencial','OSDE'),
    w(2,'10:00','Hernán P.','341 555 0104','Presencial','Particular'), w(3,'17:00','Carla M.','341 555 0105','Online','Sancor Salud'), w(4,'11:00','Diego A.','341 555 0106','Presencial','Particular') ];
  const s = {cfg:JSON.parse(JSON.stringify(DEFAULT)), turnos, reqs:[]}; let n = 0;
  if(!DEFAULT.selfPick) s.reqs.push({id:uid(), name:'Martín L.', phone:'341 555 0107', age:29, cov:'Particular', avail:'por la tarde. Lunes o miércoles', pain:DEFAULT.q2?'Sí':'', demo:true});
  for(let i=1;i<10 && n<2 && DEFAULT.selfPick;i++){ const d = iso(addDays(base,i)); const f = freeSlots(d, s); if(f.length>1){ s.turnos.push(n ? {id:uid(), date:d, time:f[1], name:'Sofía B.', phone:'341 555 0108', mode:'Online', cov:'Particular', kind:'paciente', status:'pedido', weekly:false, skip:[], demo:true}
      : {id:uid(), date:d, time:f[1], name:'Martín L.', phone:'341 555 0107', mode:'Presencial', cov:'Particular', age:29, kind:'consulta', status:'consulta', weekly:false, skip:[], demo:true}); n++; } }
  return s;
}
let S;
function load0(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.cfg && r.cfg.os && r.cfg.ask && r.turnos){ S = r; S.reqs = S.reqs||[]; S.cfg.lic = S.cfg.lic||''; normCfg(S.cfg); S.cfg.photo = DEFAULT.photo; S.cfg.tags = S.cfg.tags||DEFAULT.tags; return; } }catch(e){} S = seed(); }
function save0(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ===== Agenda =====
function slots(date, s){ s = s||S; const c = s.cfg.days[day(date).getDay()]; if(!c || !c.on || s.cfg.blocked.includes(date)) return []; const out = []; for(let m = mins(c.from); m + Math.min(s.cfg.step, s.cfg.dur) <= mins(c.to); m += s.cfg.step) out.push(hhmm(m)); return out; }
function turnoAt(date, time, s){ s = s||S; const wd = day(date).getDay(); return s.turnos.find(t => t.time===time && (t.date===date || (t.weekly && date>t.date && day(t.date).getDay()===wd && !(t.skip||[]).includes(date)))); }
const isBlocked = (date,time,s) => (s||S).cfg.blockedSlots.includes(date+'|'+time);
function freeSlots(date, s){ const now = new Date(), lim = now.getHours()*60+now.getMinutes()+120, td = today(); return slots(date,s).filter(t => !turnoAt(date,t,s) && !isBlocked(date,t,s) && (date>td || (date===td && mins(t)>lim))); }
const nextDays = n => Array.from({length:n}, (_,i) => iso(addDays(new Date(), i)));

// ===== Página pública =====
let P = {kind:'nuevo', mode:null, date:null, time:null, step:'pick', last:null, motivo:'', f:{}};
// Configuración: completa lo que falte sin pisar lo que el profesional ya eligió (regla 15/11)
function normCfg(c){ c.fees = Object.assign({part:0, show:true, partOn:true}, c.fees||{}); if(c.fees.partOn===undefined) c.fees.partOn = true;
  c.os = (c.os||[]).map(o => Object.assign({n:'', on:true, plus:0}, o, {cop: o.cop!==undefined ? !!o.cop : Number(o.plus)>0}));
  if(c.osOther===undefined) c.osOther = true; if(c.osAll){ c.osOther = true; } delete c.osAll;
  if(!c.q2) c.q2 = c.ask && c.ask.pain ? 'Estás con dolor?' : ''; /* configuraciones viejas con la pregunta del dolor la conservan */ c.ask = {age:true, motivo:true}; c.call = !!c.call; return c; }
normCfg(DEFAULT);
const osOn = () => S.cfg.os.filter(o => o.on && o.n);
// lo que puede elegir el paciente: Particular (si lo atiende), las obras sociales activadas y "Otra" (si la activó, o si no cargó ninguna)
const covList = () => (S.cfg.fees.partOn ? ['Particular'] : []).concat(osOn().map(o => o.n)).concat(S.cfg.osOther || !osOn().length ? ['Otra obra social'] : []);
const q2Field = f => S.cfg.q2 ? `<label id="lD">${esc(S.cfg.q2)}</label><div class="seg" role="group" aria-labelledby="lD" style="margin:0">${['Sí','No'].map(k => `<button data-a="pain" data-v="${k}" class="${f.pain===k?'on':''}" aria-pressed="${f.pain===k}">${k}</button>`).join('')}</div>` : '';
const q2Txt = (a, c) => a && (c||S.cfg).q2 ? (c||S.cfg).q2+' '+a : '';
const covLbl = o => o==='Otra obra social' && !osOn().length ? 'Obra social' : o==='Otra obra social' ? 'Otra' : o;
function covField(f){ const fl = feeLine(f.cov), L = covList(); if(L.length===1 && !f.cov) f.cov = L[0];
  return `<label for="fC">${S.cfg.fees.partOn ? 'Obra social o particular' : 'Tu obra social'}</label><select id="fC" data-f="cov">${L.length>1?'<option value="">Elegí una opción</option>':''}${L.map(o => `<option value="${esc(o)}" ${o===f.cov?'selected':''}>${esc(covLbl(o))}</option>`).join('')}</select>`
    + (f.cov==='Otra obra social' ? `<label for="fO">Cuál es tu obra social</label><input id="fO" data-f="other" type="text" value="${esc(f.other||'')}">` : '') + (fl ? `<p class="pick">${esc(fl)}</p>` : ''); }
function feeLine(cov){ const c = S.cfg, o = c.os.find(x => x.n===cov); if(!cov) return ''; if(cov==='Otra obra social') return `${c.short} te confirma si trabaja con tu obra social.`; if(!c.fees.show) return '';
  if(cov==='Particular') return c.fees.part ? `${RW.Ses} particular: ${money(c.fees.part)}.` : ''; return o ? (o.cop && o.plus>0 ? `Con ${o.n} pagás un copago de ${money(o.plus)} por ${RW.ses}.` : `Con ${o.n} no pagás nada aparte.`) : ''; }
// franjas que de verdad atiende (regla 15/11: no ofrecer "Por la mañana" a quien atiende solo a la tarde)
// Días y franjas que atiende, según los horarios cargados en el panel (Dardo 15/11: lo que ve el paciente sale de ahí)
const ORD = [1,2,3,4,5,6,0];
function agenda(c){ return ORD.filter(d => c.days && c.days[d] && c.days[d].on).map(d => { const x = c.days[d]; return {d, am:x.from < '13:00', pm:x.to > '13:00'}; }); }
function diasTxt(ds){ const n = ds.map(d => ORD.indexOf(d)); if(ds.length>=3 && n.every((v,i) => !i || v===n[i-1]+1)) return WD[ds[0]]+' a '+WD[ds[ds.length-1]]; const w = ds.map(d => WD[d]); return w.length>1 ? w.slice(0,-1).join(', ')+' y '+w[w.length-1] : w[0]; }
function agendaTxt(c){ const g = {}; agenda(c).forEach(x => { const k = x.am && x.pm ? 'de mañana y de tarde' : x.am ? 'por la mañana' : 'por la tarde'; (g[k] = g[k]||[]).push(x.d); });
  return ['por la mañana','por la tarde','de mañana y de tarde'].filter(k => g[k]).map(k => cap(diasTxt(g[k]))+' '+k+'.').join(' '); }
function cuandoOpts(c){ const o = []; agenda(c).forEach(x => { if(x.am) o.push({k:'d'+x.d+'am', l:cap(WD[x.d])+' por la mañana'}); if(x.pm) o.push({k:'d'+x.d+'pm', l:cap(WD[x.d])+' por la tarde'}); }); return o; }
function franjas(c){ const on = Object.values(c.days||{}).filter(d => d && d.on); return {am: on.some(d => d.from < '13:00'), pm: on.some(d => d.to > '13:00')}; }
function siteReq(){ const c = S.cfg, f = P.f;
  let h = `<section class="sheet"><h2>Pedí tu turno</h2><p class="sub">${c.call ? `Dejá tus datos y ${esc(c.short)} te llama para una primera charla antes de darte el turno.` : `Dejá tus datos y ${esc(c.short)} te escribe por WhatsApp con el horario.`}</p><div class="form" style="border-top:0;padding-top:0">
    <label for="fN" style="margin-top:0">Nombre y apellido</label><input id="fN" data-f="name" type="text" autocomplete="name" value="${esc(f.name||'')}">`;
  if(c.ask.age) h += `<label for="fE">Edad</label><input id="fE" data-f="age" type="tel" inputmode="numeric" maxlength="3" value="${esc(f.age||'')}">`;
  h += `<label for="fP">Tu WhatsApp</label><input id="fP" data-f="phone" type="tel" autocomplete="tel" placeholder="Ej.: 341 555 1234" value="${esc(f.phone||'')}">`;
  h += covField(f);
  const OP = cuandoOpts(c);
  if(OP.length) h += `<label id="lA">Cuándo podés</label><p class="pick" style="margin:2px 0 6px">${esc(c.short)} atiende: ${esc(agendaTxt(c))}</p><p class="mut" style="margin-bottom:4px">Marcá todo lo que te quede bien.</p>${OP.map(o => `<label class="chk"><input type="checkbox" data-fc="${o.k}" ${f[o.k]?'checked':''}> ${esc(o.l)}</label>`).join('')}`;
  if(c.ask.motivo) h += `<label for="fM">Motivo de consulta, en pocas palabras</label><textarea id="fM" data-f="motivo" rows="3">${esc(f.motivo||'')}</textarea>`;
  h += q2Field(f);
  return h + `<button class="btn w gap" data-a="sendreq">Pedir turno</button></div></section>`; }
function msgReq(r, motivo){ return `Hola ${S.cfg.short}! Quiero pedir un turno.\nNombre: ${r.name}${r.age?'\nEdad: '+r.age:''}\nCobertura: ${r.cov==='Particular'?'particular':r.cov}\nPuedo: ${r.avail||'a convenir'}${motivo?'\nMotivo: '+motivo:''}${q2Txt(r.pain)?'\n'+q2Txt(r.pain):''}\nMi WhatsApp: ${r.phone}`; }

      ${c.wa ? `<p class="gap mut">Si WhatsApp no se abrió solo, tocá acá para avisarle:</p><a class="btn w gap" href="${waLink(c.wa, msgReq(t, P.motivo))}">Avisar por WhatsApp</a>` : ''}

  } else if(P.step==='done' && P.last){ const t = P.last, cons = t.kind==='consulta';
    h += `<section class="sheet"><div class="done"><h2>${cons?'Consulta enviada':'Turno pedido'}</h2><p class="gap"><b>${esc(cap(longDate(t.date)))}, ${t.time}</b><br>${c.modes.length>1?esc(t.mode)+', ':''}${c.dur} minutos.</p>

  } else if(!c.selfPick){ h += siteReq();
  } else {
    h += `<section class="sheet"><h2>Elegí día y horario</h2><p class="sub">${nuevo ? `Elegí el horario que te queda bien. ${esc(c.short)} te lo confirma por WhatsApp.` : `Turnos de ${c.dur} minutos. Mirá los libres y pedí el tuyo.`}</p>
      <div class="seg" role="group" aria-label="Tipo de consulta">${[['nuevo','Primera consulta'],['paciente','Ya soy paciente']].map(([k,l]) => `<button data-a="kind" data-v="${k}" class="${k===P.kind?'on':''}" aria-pressed="${k===P.kind}">${l}</button>`).join('')}</div>`;
    if(c.modes.length>1) h += `<div class="seg" role="group" aria-label="Modalidad">${c.modes.map(m => `<button data-a="mode" data-v="${esc(m)}" class="${m===P.mode?'on':''}" aria-pressed="${m===P.mode}">${esc(m)}</button>`).join('')}</div>`;

    else { h += `<div class="daytitle">${esc(cap(longDate(P.date)))}</div>`;
      slots(P.date).forEach(t => { const free = freeSlots(P.date).includes(t);
        h += free ? `<div class="row ${P.time===t?'sel':''}"><span class="t">${t}</span><span class="s">Libre</span><button class="btn sm ${P.time===t?'':'o'}" data-a="time" data-v="${t}">${P.time===t?'Elegido':'Elegir'}</button></div>`
                  : `<div class="row off"><span class="t">${t}</span><span class="s">Ocupado</span><span></span></div>`; });
    }
    if(P.time){ h += `<div class="form" id="datos"><h3>Tus datos</h3><p class="pick">${esc(cap(longDate(P.date)))}, ${P.time}. ${esc(P.mode)}.</p>
      <label for="fN">Nombre y apellido</label><input id="fN" data-f="name" type="text" autocomplete="name" value="${esc(f.name||'')}">`;
      if(nuevo) h += `<label for="fE">Edad</label><input id="fE" data-f="age" type="tel" inputmode="numeric" maxlength="3" value="${esc(f.age||'')}">`;
      h += `<label for="fP">Tu WhatsApp</label><input id="fP" data-f="phone" type="tel" autocomplete="tel" placeholder="Ej.: 341 555 1234" value="${esc(f.phone||'')}">`;
      if(nuevo){ h += covField(f)
          + `<label for="fM">Motivo de consulta, en pocas palabras</label><textarea id="fM" data-f="motivo" rows="3">${esc(f.motivo||'')}</textarea>` + q2Field(f); }
      h += `<button class="btn w gap" data-a="send">${nuevo?'Enviar mi consulta':'Pedir este turno'}</button><p class="mut gap">${esc(c.cancel)}</p></div>`; }
    h += `</section>`;
  }
  const donde = c.modes.length>1 ? (P.mode==='Online' ? 'Por videollamada.' : c.place) : (c.modes[0]==='Online' ? 'Por videollamada.' : c.place);
  const rows = [];
  if(donde) rows.push(['Dónde', donde]);
  if(c.selfPick) rows.push(['Cuánto dura', c.dur+' minutos.']);
  if(c.selfPick && nuevo) rows.push(['Honorarios', !c.fees.show && f.cov!=='Otra obra social' ? 'Te los paso al confirmar el turno.' : (feeLine(f.cov) || 'Cuando elijas obra social o particular, acá ves cuánto es.')]);
  if(!c.selfPick && c.fees.show && c.fees.part) rows.push(['Honorarios', RW.Ses+' particular: '+money(c.fees.part)+'.']);
  if(c.cancel) rows.push(['Si tenés que cancelar', c.cancel]);
  h += (rows.length ? `<section class="info"><h2>Antes de venir</h2><dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></section>` : '') + `

  $('#site').innerHTML = h;
}

function calLink(t, date){ const s = day(date), m = mins(t.time), f = (mm) => date.replace(/-/g,'')+'T'+pad(Math.floor(mm/60))+pad(mm%60)+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Turno '+t.name)+'&dates='+f(m)+'/'+f(m+S.cfg.dur)+'&details='+encodeURIComponent('WhatsApp: '+t.phone)+(t.weekly?'&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY'):''); }

  if(a==='msave'){ c.title = $('#mT').value; c.lead = $('#mD').value.trim(); c.tags = $('#mG').value.split(',').map(x => x.trim()).filter(Boolean); /* el nombre no se cambia desde el panel (regla 15/11): lo cambiamos nosotros */ c.lic = $('#mL').value.trim(); c.role = $('#mR').value.trim() || c.role; c.wa = $('#mW').value.trim(); c.place = $('#mP').value.trim(); c.cancel = $('#mC').value.trim(); save(); renderPanel(); renderSite(); toast('Guardado.'); }
  if(a==='osadd'){ readCobros(); const n = $('#oNew').value.trim(); if(!n){ toast('Escribí el nombre de la obra social.'); return; } c.os.push({n, on:true, cop:false, plus:0}); save(); renderPanel(); renderSite(); }
  if(a==='osdel'){ readCobros(); c.os.splice(Number(v),1); save(); renderPanel(); renderSite(); }
  if(a==='csave'){ readCobros(); const sc = c.os.find(o => o.on && o.cop && !o.plus); if(sc){ toast('Poné el monto del copago de '+sc.n+'.'); return; } save(); renderPanel(); renderSite(); toast('Honorarios guardados.'); }
  if(a==='reset'){ S = seed(); save(); A.date = today(); A.scr = 'home'; renderPanel(); renderSite(); toast('Datos de ejemplo restaurados.'); }
  if(a==='out'){ A.pin = ''; A.ok = false; S.turnos = []; S.reqs = []; loadSlots(); A.scr = 'home'; renderPanel(); scrollTo(0,0); }
});
document.addEventListener('change', e => { const fc = e.target.dataset && e.target.dataset.fc; if(fc) P.f[fc] = e.target.checked;
  if(e.target.classList && e.target.classList.contains('moS')){ A.mo = {q2:$('#moQ') ? $('#moQ').value : S.cfg.q2, sp:e.target.value==='1', call:!!($('#moC') ? $('#moC').checked : S.cfg.call), modes:[...document.querySelectorAll('.mM:checked')].map(i => i.value)}; renderPanel(); } });
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.f; if(!k) return; P.f[k] = e.target.value; if(k==='cov'){ renderSite(); const el = $('#fC'); if(el) el.focus(); } });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='pin') $('[data-a="pin"]').click(); });

// ===== App funcional: datos en la planilla del profesional =====
const API = 'https://script.google.com/macros/s/AKfycbxcv-Wg40xQbjDn92_8W6i2VpEqXS3vZTsNDH_NzN2BYKyMLi3Kw2AdU8P28SN9gRof/exec';
let SNAP = null, LAST = 0, QUEUE = Promise.resolve();
const api = body => fetch(API, {method:'POST', body:JSON.stringify(Object.assign(body, {c:CLIENT}))}).then(r => r.json());
const hit = k => fetch('https://abacus.jasoncameron.dev/hit/websemprendedores/' + CLIENT + k).catch(()=>{});
// el nombre no se cambia desde el panel (lo cambiamos nosotros): siempre sale de DEFAULT
function mkCfg(extra){ const x = (extra && extra.cfg) || {}, c = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), x);
  c.name = DEFAULT.name; c.short = DEFAULT.short; c.mono = DEFAULT.mono; c.photo = x.photo || DEFAULT.photo; if(!x.q2 && x.ask && x.ask.pain) c.q2 = 'Estás con dolor?'; normCfg(c);
  c.blocked = c.blocked||[]; c.blockedSlots = c.blockedSlots||[]; c.tags = Array.isArray(c.tags) ? c.tags : []; c.remDone = c.remDone||[]; return c; }
const face = c => c.photo ? `<img class="pho" src="${esc(c.photo)}" alt="" width="76" height="76">` : `<div class="mono" aria-hidden="true">${esc(c.mono)}</div>`;
const LBL = {confirmado:'Turno confirmado', pedido:'Turno por confirmar', consulta:'Primera consulta'};
const line = (k,v) => v ? k+': '+v : '';
const pick = (notes,k) => { const m = String(notes||'').split('\n').find(l => l.indexOf(k+': ')===0); return m ? m.slice(k.length+2) : ''; };
function toOrder(x, isReq){ return isReq
  ? {id:x.id, created:x.created||today(), date:x.created||today(), product:'Pedido nuevo', people:x.age||'', fill:'', delivery:x.cov||'', name:x.name, phone:x.phone||'', notes:[line('Puede',x.avail), line('Motivo',x.motivo), line('Con dolor',x.pain)].filter(Boolean).join('\n'), pay:'sin', total:0, paid:0, done:false}
  : {id:x.id, created:x.created||today(), date:x.date, product:LBL[x.status]||LBL.confirmado, people:x.age||'', fill:x.time, delivery:x.cov||'', name:x.name, phone:x.phone||'', notes:[line('Motivo',x.motivo), line('Con dolor',x.pain), line('Semanas liberadas',(x.skip||[]).join(', '))].filter(Boolean).join('\n'), pay:'sin', total:0, paid:0, done:!!x.weekly}; }
function fromOrders(list){ const turnos = [], reqs = [];
  list.forEach(o => { const base = {id:o.id, created:o.created, name:o.name, phone:o.phone, age:Number(o.people)||0, cov:o.delivery, motivo:pick(o.notes,'Motivo'), pain:pick(o.notes,'Con dolor')};
    if(o.product==='Pedido nuevo') reqs.push(Object.assign(base, {avail:pick(o.notes,'Puede')}));
    else { const st = Object.keys(LBL).find(k => LBL[k]===o.product) || 'confirmado'; const sk = pick(o.notes,'Semanas liberadas');
      turnos.push(Object.assign(base, {date:o.date, time:o.fill, mode:S.cfg.modes[0], kind:st==='consulta'?'consulta':'paciente', status:st, weekly:!!o.done, skip:sk?sk.split(', '):[]})); } });
  return {turnos, reqs}; }
const snapOf = () => { const m = {}; S.turnos.forEach(x => m[x.id] = JSON.stringify(toOrder(x,false))); S.reqs.forEach(x => m[x.id] = JSON.stringify(toOrder(x,true))); return {m, cfg:JSON.stringify(S.cfg)}; };
function setData(d){ S.cfg = mkCfg(d.settings && d.settings.extra); const x = fromOrders(d.orders||[]); S.turnos = x.turnos; S.reqs = x.reqs; SNAP = snapOf(); LAST = Date.now(); cacheCfg(); }
const CK = KEY + '_pub'; const cacheCfg = () => { try{ localStorage.setItem(CK, JSON.stringify(S.cfg)); }catch(e){} };
function load(){}
const dirty = () => { if(!S || !SNAP) return false; const n = snapOf(); return n.cfg!==SNAP.cfg || Object.keys(n.m).some(id => n.m[id]!==SNAP.m[id]) || Object.keys(SNAP.m).some(id => !(id in n.m)); };
const PK = () => KEY + '_pend';
const setts = cfg => ({maxPerDay:9999, blocked:[], spOn:false, senaPct:0, extra:{kind:'turnos', cfg}});
function pendStore(){ try{ if(!dirty()){ localStorage.removeItem(PK()); return; } const n = snapOf(); localStorage.setItem(PK(), JSON.stringify({up:Object.keys(n.m).filter(id => n.m[id]!==SNAP.m[id]).map(id => JSON.parse(n.m[id])), del:Object.keys(SNAP.m).filter(id => !(id in n.m)), cfg:n.cfg!==SNAP.cfg ? JSON.parse(n.cfg) : null})); }catch(e){} }
let RETRY = null; function pend(on){ pendStore(); let b = $('#pend'); if(on && !b){ b = document.createElement('div'); b.id = 'pend'; b.setAttribute('role','status'); b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:60;padding:12px 16px;background:#8a1c1c;color:#fff;font-weight:700;font-size:16px;line-height:1.35;text-align:center'; b.textContent = 'Sin conexión: hay cambios sin guardar. No cierres la app; se guardan solos cuando vuelva la señal.'; document.body.appendChild(b); } if(!on && b){ b.remove(); toast('Listo, quedó todo guardado.'); } clearTimeout(RETRY); if(on) RETRY = setTimeout(() => { if(A.ok && dirty()) save(); else pend(false); }, 8000); }
function save(){ if(!S || !A.ok || !SNAP) return; cacheCfg(); const prev = SNAP, now = snapOf(), up = [], del = [];
  Object.keys(now.m).forEach(id => { if(now.m[id]!==SNAP.m[id]) up.push(JSON.parse(now.m[id])); });
  Object.keys(SNAP.m).forEach(id => { if(!(id in now.m)) del.push(id); });
  const cfgCh = now.cfg!==SNAP.cfg; SNAP = now; if(!up.length && !del.length && !cfgCh) return;
  const pin = A.pin, cfg = JSON.parse(now.cfg);
  QUEUE = QUEUE.then(async () => { try{
      if(up.length){ const r = await api({a:'saveOrders', pin, orders:up}); if(!r.ok) throw 0; }
      if(del.length){ const r = await api({a:'delOrders', pin, ids:del}); if(!r.ok) throw 0; }
      if(cfgCh){ const r = await api({a:'saveSettings', pin, settings:setts(cfg)}); if(!r.ok) throw 0; }
      if($('#pend') && !dirty()) pend(false); else pendStore();
    }catch(e){ /* lo que no se pudo guardar vuelve a quedar pendiente y se reintenta solo */
      up.forEach(o => { if(o.id in prev.m) SNAP.m[o.id] = prev.m[o.id]; else delete SNAP.m[o.id]; }); del.forEach(id => { SNAP.m[id] = prev.m[id]; }); if(cfgCh) SNAP.cfg = prev.cfg;
      if(!$('#pend')) toast('No se pudo guardar. Se reintenta solo.'); pend(true); } });
}
async function login(pin, btn){ if(!pin){ toast('Escribí tu clave.'); return; } if(btn) btn.disabled = true;
  try{ A.pin = pin; let d = await api({a:'all', pin}); if(!d.ok){ A.pin = ''; toast(d.msg||'Clave incorrecta.'); if(btn) btn.disabled = false; return; }
    let pd = null; try{ pd = JSON.parse(localStorage.getItem(PK())); }catch(e){}
    if(pd){ let ok = true; if(pd.up && pd.up.length) ok = (await api({a:'saveOrders', pin, orders:pd.up})).ok && ok; if(pd.del && pd.del.length) ok = (await api({a:'delOrders', pin, ids:pd.del})).ok && ok; if(pd.cfg) ok = (await api({a:'saveSettings', pin, settings:setts(pd.cfg)})).ok && ok; if(!ok) throw 0; localStorage.removeItem(PK()); d = await api({a:'all', pin}); }
    setData(d); A.ok = true; A.scr = 'home'; renderPanel(); scrollTo(0,0);
  }catch(e){ A.pin = ''; toast('No hay conexión. Probá de nuevo.'); if(btn) btn.disabled = false; } }
async function refresh(){ if(!A.ok) return; try{ await QUEUE; if(dirty()){ save(); return; } const d = await api({a:'all', pin:A.pin}); if(d.ok && A.ok){ const before = JSON.stringify(SNAP.m); setData(d); if(JSON.stringify(SNAP.m)!==before && A.scr==='home') renderPanel0(); } }catch(e){} }
async function sendReq(r, btn){ if(btn) btn.disabled = true;
  try{ const d = await api({a:'order', order:toOrder(Object.assign({created:today()}, r), true)}); if(!d.ok){ toast(d.msg||'No se pudo enviar. Probá de nuevo.'); if(btn) btn.disabled = false; return; }
    P.last = Object.assign({req:true}, r); P.motivo = r.motivo; P.step = 'done'; P.f = {}; renderSite(); scrollTo(0,0); hit('-pedidos');
    if(S.cfg.wa) location.href = waLink(S.cfg.wa, msgReq(r, r.motivo));
  }catch(e){ toast('No hay conexión. Probá de nuevo.'); if(btn) btn.disabled = false; } }
function renderPanel(){ renderPanel0(); if(A.ok && A.scr==='home' && Date.now()-LAST>45000){ LAST = Date.now(); refresh(); } }

// ----- horarios ocupados para la página (backend v6: sin nombres) y turno elegido por el paciente -----
function ghosts(sl){ return (sl||[]).map((x,i) => ({id:'g'+i, date:x.date, time:x.time, weekly:!!x.weekly, skip:x.skip||[], status:'confirmado', name:'', ghost:true})); }
async function loadSlots(){ try{ const d = await api({a:'pub'}); if(d.ok && !A.ok){ S.cfg = mkCfg(d.settings && d.settings.extra); S.turnos = ghosts(d.slots); cacheCfg(); return d; } }catch(e){} return null; }
async function sendPick(t, motivo, btn){ if(btn) btn.disabled = true;
  try{ const o = toOrder(Object.assign({created:today(), motivo}, t), false), d = await api({a:'order', order:o});
    if(!d.ok){ toast(d.msg||'No se pudo enviar. Probá de nuevo.'); if(/ocup/i.test(d.msg||'')){ P.time = null; await loadSlots(); renderSite(); } if(btn) btn.disabled = false; return; }
    S.turnos.push(Object.assign({ghost:true}, t)); P.last = t; P.motivo = motivo; P.step = 'done'; P.time = null; P.f = {}; renderSite(); scrollTo(0,0); hit('-pedidos');
    if(S.cfg.wa) location.href = waLink(S.cfg.wa, msgPedido(t, motivo));
  }catch(e){ toast('No hay conexión. Probá de nuevo.'); if(btn) btn.disabled = false; } }

// ----- Recordatorios programados (Dardo, 15/11) -----
const nowStamp = () => { const n = new Date(); return iso(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes()); };
const padT = h => { const p = String(h).split(':'); return pad(Number(p[0]))+':'+(p[1]||'00'); };
function remDue(d, time){ return Number(String(time).split(':')[0]) < 13 ? iso(addDays(day(d),-1))+' 10:00' : d+' 09:00'; }
function remList(){ const now = nowStamp(), td = today(), out = [];
  [td, iso(addDays(new Date(),1))].forEach(d => slots(d).concat(S.turnos.filter(x => x.date===d).map(x => x.time)).filter((v,i,a) => a.indexOf(v)===i).forEach(time => { const tu = turnoAt(d, time);
    if(!tu || tu.status!=='confirmado' || !tu.phone) return;
    /* turno dado para hoy o mañana: sin recordatorio (la confirmación está fresca) */
    if(d===tu.date && d <= iso(addDays(day(tu.created||td),1))) return;
    const k = tu.id+'|'+d; if(S.cfg.remDone.includes(k)) return;
    if(remDue(d, tu.time) <= now && now < d+' '+padT(tu.time)) out.push({tu, d, k}); }));
  return out; }
function remMsg(tu, d){ const fn = tu.name.split(' ')[0], am = Number(String(tu.time).split(':')[0]) < 13 && d!==today();
  return `Hola ${fn}! Te recuerdo tu turno de ${am?'mañana':'hoy'}, ${shortDate(d)}, a las ${tu.time}${modeTxt(tu)}. Te espero.`; }
function remSection(){ const l = remList(); if(!l.length) return '';
  return `<h2 class="sec">${l.length===1?'1 recordatorio para mandar':l.length+' recordatorios para mandar'}</h2><p class="hint" style="margin:-4px 0 10px">Aparecen solos el día que toca. Tocá “Mandar recordatorio” y se abre tu WhatsApp con el mensaje escrito.</p><section class="sheet">${l.map(x => `<div class="req"><h3 style="font-size:20px">${esc(x.tu.name)}</h3><p class="mut">${esc(cap(shortDate(x.d)))}, ${x.tu.time}.</p><div class="quick gap" style="margin-bottom:0"><a class="btn" target="_blank" rel="noopener" data-f2="remsent" data-k="${x.k}" href="${esc(waLink(x.tu.phone, remMsg(x.tu, x.d)))}">Mandar recordatorio</a><button class="btn o" data-f2="remskip" data-k="${x.k}">No mandar</button></div></div>`).join('')}</section>`; }
function remMark(k){ const td = today(); S.cfg.remDone = S.cfg.remDone.filter(x => x.split('|')[1] >= td).concat([k]); save(); }

// ----- foto, clave y recordatorios -----
function squareShot(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => { const s = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = Math.min(480, s); c.getContext('2d').drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .85)); }; im.src = fr.result; }; fr.readAsDataURL(file); }); }
document.addEventListener('change', async e => { const t = e.target;
  if(t.id==='mF' && t.files && t.files[0]){ toast('Subiendo la foto…'); try{ const r = await api({a:'photo', pin:A.pin, data:await squareShot(t.files[0]), name:'perfil_'+CLIENT+'.jpg'}); if(!r.ok) throw 0; S.cfg.photo = r.url; save(); const v = $('#mFv'); if(v) v.innerHTML = face(S.cfg); renderSite(); toast('Foto cambiada.'); }catch(x){ toast('No se pudo subir la foto. Probá de nuevo.'); } t.value = ''; } });
document.addEventListener('click', async e => { const b = e.target.closest('[data-f2]'); if(!b) return; const a = b.dataset.f2;
  if(a==='remsent'){ const k = b.dataset.k; setTimeout(() => { remMark(k); if(A.scr==='home') renderPanel0(); }, 600); }
  if(a==='remskip'){ remMark(b.dataset.k); renderPanel0(); toast('Listo, ese recordatorio no se manda.'); }
  if(a==='setpin'){ const n = $('#nPin').value.trim(); if(!/^\d{4,8}$/.test(n)){ toast('La clave tiene que tener entre 4 y 8 números.'); return; } b.disabled = true;
    try{ const r = await api({a:'setPin', pin:A.pin, newPin:n}); if(r.ok){ A.pin = n; $('#nPin').value = ''; toast('Clave cambiada.'); } else toast(r.msg||'No se pudo cambiar.'); }catch(x){ toast('No hay conexión. Probá de nuevo.'); } b.disabled = false; }
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && A.ok && A.scr==='home') refresh(); });

// ===== Arranque =====
function boot(){ let c0 = null; try{ c0 = JSON.parse(localStorage.getItem(CK)); }catch(e){}
  S = {cfg:mkCfg(c0 ? {cfg:c0} : null), turnos:[], reqs:[]}; addEventListener('hashchange', route); route(); hit(location.hash==='#panel' ? '-panel' : '');
  loadSlots().then(d => { if(d && location.hash!=='#panel') renderSite(); }); }
function route(){ const p = location.hash==='#panel'; $('#site').hidden = p; $('#panel').hidden = !p; if(p) renderPanel(); else renderSite(); scrollTo(0,0); }
boot();
