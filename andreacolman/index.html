<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E5661">
<title>Andrea Colman, psicóloga. Turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--paper:#fff;--ink:#14282E;--mut:#4B5F65;--line:#CBD6D8;--pet:#1E5661;--pet2:#17444D;--amb:#D9972B;--ambbg:#FBF1DC;--off:#7F9094;--red:#9B3B2E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:Literata,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 56px}
.mut{color:var(--mut)}

/* cabecera */
.top{display:flex;gap:14px;align-items:center;padding:26px 0 8px}
.mono{flex:none;width:56px;height:56px;border-radius:50%;background:var(--pet);color:#fff;display:grid;place-items:center;font:600 22px Literata,Georgia,serif;letter-spacing:.5px}
.top h1{font-size:30px}
.top p{color:var(--mut);font-size:17px;margin-top:2px}
.lead{margin:10px 0 22px;font-size:19px}

/* hoja de agenda */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet>h2{font-size:23px;padding:18px 16px 4px}
.sheet>.sub{padding:0 16px 14px;color:var(--mut);font-size:17px}
.seg{display:flex;margin:0 16px 14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:#fff;font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.days{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:66px;min-height:74px;padding:8px 0 6px;border:0;border-right:1px solid var(--line);border-bottom:4px solid transparent;background:#fff;text-align:center;line-height:1.1}
.days button b{display:block;font:600 25px Literata,Georgia,serif;margin-top:3px}
.days button span{font-size:16px;color:var(--mut)}
.days button.on{background:var(--ambbg);border-bottom-color:var(--amb)}
.days button:disabled{cursor:default;color:var(--off);background:#F7F9F9}
.days button:disabled span,.days button:disabled b{color:var(--off)}
.daytitle{padding:14px 16px 10px;border-top:1px solid var(--line);font-weight:700}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;min-height:58px;padding:6px 16px;border-top:1px solid var(--line)}
.row .t{font-weight:700;font-size:21px}
.row .s{color:var(--pet);font-weight:700}
.row.off .t{color:var(--off);text-decoration:line-through}
.row.off .s{color:var(--off);font-weight:400}
.row.sel{background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}
.row .who{font-weight:700;line-height:1.25}
.row .tag{display:block;font-weight:400;font-size:16px;color:var(--mut)}
.row .tag b{color:var(--red)}
.empty{padding:18px 16px;border-top:1px solid var(--line);color:var(--mut)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border:2px solid var(--pet);border-radius:8px;background:var(--pet);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn.w{width:100%}
.btn.o{background:#fff;color:var(--pet)}
.btn.sm{min-height:42px;padding:0 14px;font-size:17px}
.btn.del{background:#fff;color:var(--red);border-color:var(--red)}
.acts{display:grid;gap:8px;padding:4px 16px 16px;background:var(--ambbg);box-shadow:inset 4px 0 0 var(--amb)}

/* formularios */
.form{padding:16px;border-top:1px solid var(--line)}
.form h3{font-size:20px;margin-bottom:4px}
label{display:block;font-weight:700;margin:14px 0 5px}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;min-height:50px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--pet);outline:0}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:14px 0 0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--pet)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>div{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.back{margin:18px 0 0}
.sec{font-size:21px;margin:22px 0 8px}
.days button small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.days button:disabled small{color:var(--off)}
.opt{flex-direction:column;align-items:flex-start;justify-content:center;min-height:68px;padding:10px 16px;text-align:left;margin-top:10px}
.opt span{font-weight:400;color:var(--mut);font-size:16px}
.big{font-size:22px;font-weight:700;line-height:1.25}
.pick{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg);font-weight:700}
.gap{margin-top:16px}

/* pedido hecho */
.done{padding:22px 16px}
.done h2{font-size:26px}
.bubble{margin:10px 0 0;padding:12px 14px;border-radius:4px 14px 14px 14px;background:#E3F3E1;border:1px solid #BFDDBB;white-space:pre-line;font-size:17px;line-height:1.4}

/* info y pie */
.info{margin-top:26px}
.info h2{font-size:22px;margin-bottom:6px}
.info dl{margin:0}
.info dt{font-weight:700;margin-top:14px}
.info dd{margin:2px 0 0;color:var(--mut)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--mut)}

/* panel */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 0 12px}
.ptop h1{font-size:25px}
.tabs{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:16px}
.tabs button{flex:1;min-height:46px;padding:0 2px;border:0;background:#fff;font-weight:700;font-size:16px}
.orow{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.orow .chk{margin:0;font-weight:700}
.orow input[type=tel]{min-height:46px;padding:6px 8px}
.tabs button.on{background:var(--ink);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.note{margin:0 0 16px;padding:12px 14px;border-left:4px solid var(--amb);background:var(--ambbg)}
.note b{display:block}
.hint{font-size:16px;color:var(--mut);margin:-6px 0 16px}
.req{padding:14px 16px;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.hrow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.hrow select{min-height:46px;padding:6px 8px}
.hrow .chk{margin:0;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="site"></div>
  <div id="panel" hidden></div>
</div>
<div id="toast" role="status"></div>

<script>
// ===== Datos del profesional (se adaptan a cada cliente) =====
const DEMO = true;                 // muestra: nada sale de este celular
const KEY = 'turnos_andreacolman_v1';
const DEFAULT = {
  name:'Daniela Paz', short:'Daniela', role:'Psicóloga', mono:'DP',
  lead:'Atiendo a adultos, en consultorio en Rosario y por videollamada.',
  wa:'', modes:['Presencial','Online'], place:'Zona centro, Rosario. La dirección exacta te llega al confirmar.',
  dur:50, step:60, cancel:'Si no podés venir, avisame con 24 horas de anticipación.', fees:{part:30000, show:true},
  os:[{n:'IAPOS',on:true,plus:10000},{n:'OSDE',on:true,plus:0},{n:'Swiss Medical',on:true,plus:0},{n:'Sancor Salud',on:true,plus:8000},{n:'Medifé',on:true,plus:0},{n:'Jerárquicos Salud',on:true,plus:0},{n:'PAMI',on:false,plus:0},{n:'Galeno',on:false,plus:0}],
  days:{1:{on:true,from:'14:00',to:'20:00'},2:{on:true,from:'14:00',to:'20:00'},3:{on:true,from:'09:00',to:'13:00'},4:{on:true,from:'14:00',to:'20:00'},5:{on:true,from:'09:00',to:'13:00'},6:{on:false,from:'09:00',to:'12:00'}},
  blocked:[], blockedSlots:[],
  selfPick:true,   // true: quien entra elige un horario libre. false: deja sus datos y el profesional le da el turno
  osAll:false,     // true: trabaja con todas las obras sociales y confirma la cobertura
  ask:{age:true, motivo:true},
  call:false,      // true: antes de dar el turno, el profesional llama por teléfono
  osNote:'',       // texto que ve quien elige obra social (si está vacío: trabaja con todas)
  lic:''           // matrícula
};
Object.assign(DEFAULT, {"name": "Andrea Colman", "short": "Andrea", "role": "Psicóloga", "mono": "AC", "lead": "Atención psicológica para adultos.", "modes": ["Presencial"], "place": "", "cancel": "", "fees": {"part": 0, "show": true}, "os": [], "osAll": true, "selfPick": false, "ask": {"age": true, "motivo": false}});
const WD = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const WD3 = ['dom','lun','mar','mié','jue','vie','sáb'];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// ===== Utilidades =====
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const day = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => iso(new Date());
const longDate = s => { const d = day(s); return WD[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]; };
const shortDate = s => { const d = day(s); return WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1); };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const money = n => '$'+Number(n||0).toLocaleString('es-AR');
const mins = t => { const p = t.split(':').map(Number); return p[0]*60+p[1]; };
const hhmm = m => pad(Math.floor(m/60))+':'+pad(m%60);
const uid = () => 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let toastT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function waNum(p){ let n = String(p||'').replace(/\D/g,''); if(!n) return ''; if(!n.startsWith('54')) n = '549'+n.replace(/^0/,''); return n; }
const waLink = (p,txt) => 'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(txt);
const modeTxt = t => S.cfg.modes.length>1 && t.mode ? ` (${t.mode.toLowerCase()})` : '';

// ===== Estado (en la muestra vive solo en este celular) =====
function seed(){
  const base = new Date(), mon = addDays(base, -((base.getDay()+6)%7));
  const w = (off,time,name,phone,mode,cov) => ({id:uid(), date:iso(addDays(mon,off)), time, name, phone, mode, cov, kind:'paciente', status:'confirmado', weekly:true, skip:[], demo:true});
  const turnos = [ w(0,'15:00','Marcela R.','341 555 0101','Presencial','IAPOS'), w(0,'18:00','Tomás G.','341 555 0102','Online','Particular'), w(1,'16:00','Lucía F.','341 555 0103','Presencial','OSDE'),
    w(2,'10:00','Hernán P.','341 555 0104','Presencial','Particular'), w(3,'17:00','Carla M.','341 555 0105','Online','Sancor Salud'), w(4,'11:00','Diego A.','341 555 0106','Presencial','Particular') ];
  const s = {cfg:JSON.parse(JSON.stringify(DEFAULT)), turnos, reqs:[]}; let n = 0;
  if(!DEFAULT.selfPick) s.reqs.push({id:uid(), name:'Martín L.', phone:'341 555 0107', age:29, cov:'Particular', avail:'por la tarde. Lunes o miércoles', demo:true});
  for(let i=1;i<10 && n<2 && DEFAULT.selfPick;i++){ const d = iso(addDays(base,i)); const f = freeSlots(d, s); if(f.length>1){ s.turnos.push(n ? {id:uid(), date:d, time:f[1], name:'Sofía B.', phone:'341 555 0108', mode:'Online', cov:'Particular', kind:'paciente', status:'pedido', weekly:false, skip:[], demo:true}
      : {id:uid(), date:d, time:f[1], name:'Martín L.', phone:'341 555 0107', mode:'Presencial', cov:'IAPOS', age:29, kind:'consulta', status:'consulta', weekly:false, skip:[], demo:true}); n++; } }
  return s;
}
let S;
function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.cfg && r.cfg.os && r.cfg.ask && r.turnos){ S = r; S.reqs = S.reqs||[]; S.cfg.lic = S.cfg.lic||''; S.cfg.osNote = S.cfg.osNote||''; return; } }catch(e){} S = seed(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ===== Agenda =====
function slots(date, s){ s = s||S; const c = s.cfg.days[day(date).getDay()]; if(!c || !c.on || s.cfg.blocked.includes(date)) return []; const out = []; for(let m = mins(c.from); m + Math.min(s.cfg.step, s.cfg.dur) <= mins(c.to); m += s.cfg.step) out.push(hhmm(m)); return out; }
function turnoAt(date, time, s){ s = s||S; const wd = day(date).getDay(); return s.turnos.find(t => t.time===time && (t.date===date || (t.weekly && date>t.date && day(t.date).getDay()===wd && !(t.skip||[]).includes(date)))); }
const isBlocked = (date,time,s) => (s||S).cfg.blockedSlots.includes(date+'|'+time);
function freeSlots(date, s){ const now = new Date(), lim = now.getHours()*60+now.getMinutes()+120, td = today(); return slots(date,s).filter(t => !turnoAt(date,t,s) && !isBlocked(date,t,s) && (date>td || (date===td && mins(t)>lim))); }
const nextDays = n => Array.from({length:n}, (_,i) => iso(addDays(new Date(), i)));

// ===== Página pública =====
let P = {kind:'nuevo', mode:null, date:null, time:null, step:'pick', last:null, motivo:'', f:{}};
const covList = () => ['Particular'].concat(S.cfg.os.filter(o => o.on).map(o => o.n)).concat(['Otra obra social']);
function feeLine(cov){ const c = S.cfg, o = c.os.find(x => x.n===cov); if(!cov) return ''; if(cov==='Otra obra social') return `${c.short} te confirma si trabaja con esa obra social.`; if(!c.fees.show) return '';
  if(cov==='Particular') return c.fees.part ? `Sesión particular: ${money(c.fees.part)}.` : ''; return o ? (o.plus>0 ? `Con ${o.n} se paga un adicional de ${money(o.plus)} por sesión.` : `Con ${o.n} no pagás nada aparte.`) : ''; }
function siteReq(){ const c = S.cfg, f = P.f;
  let h = `<section class="sheet"><h2>Pedí tu turno</h2><p class="sub">${c.call ? `Dejá tus datos y ${esc(c.short)} te llama para una primera charla antes de darte el turno.` : `Dejá tus datos y ${esc(c.short)} te escribe por WhatsApp con el horario.`}</p><div class="form" style="border-top:0;padding-top:0">
    <label for="fN" style="margin-top:0">Nombre y apellido</label><input id="fN" data-f="name" type="text" autocomplete="name" value="${esc(f.name||'')}">`;
  if(c.ask.age) h += `<label for="fE">Edad</label><input id="fE" data-f="age" type="tel" inputmode="numeric" maxlength="3" value="${esc(f.age||'')}">`;
  h += `<label for="fP">Tu WhatsApp</label><input id="fP" data-f="phone" type="tel" autocomplete="tel" placeholder="Ej.: 341 555 1234" value="${esc(f.phone||'')}">`;
  if(c.osAll) h += `<label id="lC">Obra social o particular</label><div class="seg" role="group" aria-labelledby="lC" style="margin:0">${['Particular','Obra social'].map(k => `<button data-a="covk" data-v="${k}" class="${f.covk===k?'on':''}" aria-pressed="${f.covk===k}">${k}</button>`).join('')}</div>`
      + (f.covk==='Obra social' ? `<label for="fO">Cuál es tu obra social</label><input id="fO" data-f="other" type="text" value="${esc(f.other||'')}"><p class="pick">${esc(c.osNote || 'Trabajo con todas. Te confirmo la cobertura antes de darte el turno.')}</p>` : '');
  else { const fl = feeLine(f.cov); h += `<label for="fC">Obra social o particular</label><select id="fC" data-f="cov"><option value="">Elegí una opción</option>${covList().map(o => `<option ${o===f.cov?'selected':''}>${esc(o)}</option>`).join('')}</select>`
      + (f.cov==='Otra obra social' ? `<label for="fO">Cuál es tu obra social</label><input id="fO" data-f="other" type="text" value="${esc(f.other||'')}">` : '') + (fl ? `<p class="pick">${esc(fl)}</p>` : ''); }
  h += `<label id="lA">Cuándo podés</label><label class="chk" style="margin-top:4px"><input type="checkbox" data-fc="am" ${f.am?'checked':''}> Por la mañana</label><label class="chk"><input type="checkbox" data-fc="pm" ${f.pm?'checked':''}> Por la tarde</label>
    <label for="fD">Qué días te quedan mejor</label><input id="fD" data-f="days" type="text" placeholder="Ej.: lunes y miércoles" value="${esc(f.days||'')}">`;
  if(c.ask.motivo) h += `<label for="fM">Motivo de consulta, en pocas palabras</label><textarea id="fM" data-f="motivo" rows="3">${esc(f.motivo||'')}</textarea>`;
  return h + `<button class="btn w gap" data-a="sendreq">Pedir turno</button></div></section>`; }
function msgReq(r, motivo){ return `Hola ${S.cfg.short}! Quiero pedir un turno.\nNombre: ${r.name}${r.age?'\nEdad: '+r.age:''}\nCobertura: ${r.cov==='Particular'?'particular':r.cov}\nPuedo: ${r.avail||'a convenir'}${motivo?'\nMotivo: '+motivo:''}\nMi WhatsApp: ${r.phone}`; }
function renderSite(){
  const c = S.cfg, f = P.f, nuevo = P.kind==='nuevo'; if(!P.mode || !c.modes.includes(P.mode)) P.mode = c.modes[0];
  const ds = nextDays(14); if(!P.date || !freeSlots(P.date).length) P.date = ds.find(d => freeSlots(d).length) || null;
  let h = `<header class="top"><div class="mono" aria-hidden="true">${esc(c.mono)}</div><div><h1>${esc(c.name)}</h1><p>${esc(c.role)}${c.lic?'. '+esc(c.lic):''}</p></div></header><p class="lead">${esc(c.lead)}</p>`;
  if(P.step==='done' && P.last && P.last.req){ const t = P.last;
    h += `<section class="sheet"><div class="done"><h2>Turno pedido</h2><p class="gap">${c.call ? `${esc(c.short)} te llama para una primera charla y después te da el turno.` : `${esc(c.short)} te escribe por WhatsApp para darte el turno.`}</p>
      ${DEMO ? `<p class="gap mut">En la app real, acá se abre WhatsApp con este mensaje ya escrito para ${esc(c.short)}:</p><div class="bubble">${esc(msgReq(t, P.motivo))}</div>` : ''}
      <button class="btn o w gap" data-a="again">Volver al inicio</button></div></section>`;
  } else if(P.step==='done' && P.last){ const t = P.last, cons = t.kind==='consulta';
    h += `<section class="sheet"><div class="done"><h2>${cons?'Consulta enviada':'Turno pedido'}</h2><p class="gap"><b>${esc(cap(longDate(t.date)))}, ${t.time}</b><br>${c.modes.length>1?esc(t.mode)+', ':''}${c.dur} minutos.</p>
      <p class="gap">${cons ? `Antes de confirmarlo, ${esc(c.short)} te llama para una primera charla.` : `${esc(c.short)} te lo confirma por WhatsApp.`}</p>
      ${DEMO ? `<p class="gap mut">En la app real, acá se abre WhatsApp con este mensaje ya escrito para ${esc(c.short)}:</p><div class="bubble">${esc(msgPedido(t, P.motivo))}</div>` : ''}
      <button class="btn o w gap" data-a="again">Volver al inicio</button></div></section>`;
  } else if(!c.selfPick){ h += siteReq();
  } else {
    h += `<section class="sheet"><h2>Elegí día y horario</h2><p class="sub">${nuevo ? `Elegí el horario que te queda bien. Antes de confirmarlo, ${esc(c.short)} te llama para una primera charla.` : `Turnos de ${c.dur} minutos. Mirá los libres y pedí el tuyo.`}</p>
      <div class="seg" role="group" aria-label="Tipo de consulta">${[['nuevo','Primera consulta'],['paciente','Ya soy paciente']].map(([k,l]) => `<button data-a="kind" data-v="${k}" class="${k===P.kind?'on':''}" aria-pressed="${k===P.kind}">${l}</button>`).join('')}</div>`;

    h += `<div class="days">${ds.map(d => { const dd = day(d), n = freeSlots(d).length; return `<button data-a="day" data-v="${d}" class="${d===P.date?'on':''}" ${n?'':'disabled'} aria-label="${esc(longDate(d))}${n?'':', sin turnos'}"><span>${WD3[dd.getDay()]}</span><b>${dd.getDate()}</b></button>`; }).join('')}</div>`;

      h += `<label for="fP">Tu WhatsApp</label><input id="fP" data-f="phone" type="tel" autocomplete="tel" placeholder="Ej.: 341 555 1234" value="${esc(f.phone||'')}">`;

        h += `<label for="fC">Obra social o particular</label><select id="fC" data-f="cov"><option value="">Elegí una opción</option>${covList().map(o => `<option ${o===f.cov?'selected':''}>${esc(o)}</option>`).join('')}</select>`
          + (f.cov==='Otra obra social' ? `<label for="fO">Cuál es tu obra social</label><input id="fO" data-f="other" type="text" value="${esc(f.other||'')}">` : '')
          + (fl ? `<p class="pick">${esc(fl)}</p>` : '')
          + `<label for="fM">Motivo de consulta, en pocas palabras</label><textarea id="fM" data-f="motivo" rows="3">${esc(f.motivo||'')}</textarea>`; }
      h += `<button class="btn w gap" data-a="send">${nuevo?'Enviar mi consulta':'Pedir este turno'}</button><p class="mut gap">${esc(c.cancel)}</p></div>`; }
    h += `</section>`;
  }
  const donde = c.modes.length>1 ? (P.mode==='Online' ? 'Por videollamada.' : c.place) : (c.modes[0]==='Online' ? 'Por videollamada.' : c.place);
  const rows = [];
  if(donde) rows.push(['Dónde', donde]);
  if(c.selfPick) rows.push(['Cuánto dura', c.dur+' minutos.']);
  if(c.selfPick && nuevo) rows.push(['Honorarios', !c.fees.show && f.cov!=='Otra obra social' ? 'Te los paso al confirmar el turno.' : (feeLine(f.cov) || 'Cuando elijas obra social o particular, acá ves cuánto es.')]);
  if(!c.selfPick && c.fees.show && c.fees.part) rows.push(['Honorarios', 'Sesión particular: '+money(c.fees.part)+'.']);
  if(c.cancel) rows.push(['Si tenés que cancelar', c.cancel]);
  h += (rows.length ? `<section class="info"><h2>Antes de venir</h2><dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></section>` : '') + `
    <footer><span>${esc(c.name)}, ${esc(c.role.toLowerCase())}</span></footer>`;
  $('#site').innerHTML = h;
}

function freeOrAll(date){ const td = today(), n = new Date(), now = n.getHours()*60+n.getMinutes(); return slots(date).filter(t => !turnoAt(date,t) && !isBlocked(date,t) && (date>td || (date===td && mins(t)>now))); }

function readCobros(){ const c = S.cfg, num = v => Number(String(v||'').replace(/\D/g,''))||0; c.fees.part = num($('#cP').value); c.fees.show = $('#cS').checked; c.osAll = $('#cA').checked;
  document.querySelectorAll('.oOn').forEach(i => { const o = c.os[i.dataset.i]; o.on = i.checked; o.plus = num(document.querySelector('.oPl[data-i="'+i.dataset.i+'"]').value); }); }
function calLink(t, date){ const s = day(date), m = mins(t.time), f = (mm) => date.replace(/-/g,'')+'T'+pad(Math.floor(mm/60))+pad(mm%60)+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Turno '+t.name)+'&dates='+f(m)+'/'+f(m+S.cfg.dur)+'&details='+encodeURIComponent('WhatsApp: '+t.phone)+(t.weekly?'&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY'):''); }
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1), isAndroid = /Android/i.test(navigator.userAgent);
function icsText(t, date){ const m = mins(t.time), f = mm => date.replace(/-/g,'')+'T'+pad(Math.floor(mm/60))+pad(mm%60)+'00', n = new Date(), st = n.getUTCFullYear()+pad(n.getUTCMonth()+1)+pad(n.getUTCDate())+'T'+pad(n.getUTCHours())+pad(n.getUTCMinutes())+pad(n.getUTCSeconds())+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Turnos//ES','BEGIN:VEVENT','UID:'+t.id+'-'+date+'@turnos','DTSTAMP:'+st,'DTSTART:'+f(m),'DTEND:'+f(m+S.cfg.dur),'SUMMARY:Turno '+t.name].concat(t.weekly?['RRULE:FREQ=WEEKLY']:[], t.phone?['DESCRIPTION:WhatsApp '+t.phone]:[], ['END:VEVENT','END:VCALENDAR']).join('\r\n'); }
function calBtn(tu, date){ if(isIOS) return ''; // iPhone: Safari no abre el Calendario desde un archivo armado en la página (probado 13/11); necesita un .ics servido por un servidor
  if(isAndroid) return `<button class="btn o" data-a="ics" data-id="${tu.id}">Guardarlo en mi calendario</button>`;
  return `<a class="btn o" target="_blank" rel="noopener" href="${esc(calLink(tu, date))}">Guardarlo en Google Calendar</a>`; }
function showMsg(t, title, text){ A.msg = {title, text, href:waLink(t.phone, text), demo:!!t.demo}; }
function when(date){ const td = today(); return date===td ? 'de hoy' : date===iso(addDays(new Date(),1)) ? 'de mañana' : 'del '+shortDate(date); }

// ===== Acciones =====
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a, v = b.dataset.v, c = S.cfg;
  // página
  if(a==='mode'){ P.mode = v; renderSite(); }
  if(a==='day'){ P.date = v; P.time = null; renderSite(); }
  if(a==='time'){ P.time = v; renderSite(); const d = $('#datos'); if(d) d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'start'}); }
  if(a==='kind'){ P.kind = v; renderSite(); }
  if(a==='send'){ const f = P.f, nuevo = P.kind==='nuevo', name = (f.name||'').trim(), phone = (f.phone||'').trim();
    if(name.length<3){ toast('Falta tu nombre.'); $('#fN').focus(); return; }
    if(nuevo && !(Number(f.age)>0 && Number(f.age)<120)){ toast('Poné tu edad.'); $('#fE').focus(); return; }
    if(phone.replace(/\D/g,'').length<8){ toast('Revisá tu WhatsApp.'); $('#fP').focus(); return; }
    if(nuevo && !f.cov){ toast('Elegí obra social o particular.'); $('#fC').focus(); return; }
    if(nuevo && f.cov==='Otra obra social' && !(f.other||'').trim()){ toast('Escribí cuál es tu obra social.'); $('#fO').focus(); return; }
    if(turnoAt(P.date,P.time)){ toast('Ese horario se acaba de ocupar. Elegí otro.'); P.time = null; renderSite(); return; }
    const t = {id:uid(), date:P.date, time:P.time, name, phone, mode:P.mode, kind:nuevo?'consulta':'paciente', status:nuevo?'consulta':'pedido', weekly:false, skip:[]};
    if(nuevo){ t.age = Number(f.age); t.cov = f.cov==='Otra obra social' ? f.other.trim() : f.cov; }
    S.turnos.push(t); save(); P.last = t; P.motivo = nuevo ? (f.motivo||'').trim() : ''; P.step = 'done'; P.time = null; P.f = {}; renderSite(); scrollTo(0,0);
    if(c.wa) location.href = waLink(c.wa, msgPedido(t, P.motivo)); }
  if(a==='covk'){ P.f.covk = v; renderSite(); }
  if(a==='sendreq'){ const f = P.f, name = (f.name||'').trim(), phone = (f.phone||'').trim();
    if(name.length<3){ toast('Falta tu nombre.'); $('#fN').focus(); return; }
    if(c.ask.age && !(Number(f.age)>0 && Number(f.age)<120)){ toast('Poné tu edad.'); $('#fE').focus(); return; }
    if(phone.replace(/\D/g,'').length<8){ toast('Revisá tu WhatsApp.'); $('#fP').focus(); return; }
    let cov = c.osAll ? (f.covk==='Particular' ? 'Particular' : f.covk==='Obra social' ? (f.other||'').trim() : '') : (f.cov==='Otra obra social' ? (f.other||'').trim() : (f.cov||''));
    if(!cov){ toast(f.covk==='Obra social' || f.cov==='Otra obra social' ? 'Escribí cuál es tu obra social.' : 'Elegí obra social o particular.'); return; }
    const avail = [[f.am?'por la mañana':'', f.pm?'por la tarde':''].filter(Boolean).join(' o '), (f.days||'').trim()].filter(Boolean).join('. ');
    const r = {id:uid(), name, phone, age:c.ask.age?Number(f.age):0, cov, avail}; S.reqs.push(r); save(); P.last = Object.assign({req:true}, r); P.motivo = c.ask.motivo ? (f.motivo||'').trim() : ''; P.step = 'done'; P.f = {}; renderSite(); scrollTo(0,0);
    if(c.wa) location.href = waLink(c.wa, msgReq(r, P.motivo)); }
  if(a==='again'){ P.step = 'pick'; P.last = null; renderSite(); }
  // panel
  if(a==='pin'){ if($('#pin').value.trim()==='1234'){ A.ok = true; A.scr = 'home'; renderPanel(); } else toast('Clave incorrecta.'); }
  if(a==='go'){ A.scr = v; if(v==='home'){ A.w = null; A.msg = null; } renderPanel(); scrollTo(0,0); }
  if(a==='pday'){ A.date = v; renderPanel(); }
  if(a==='tsee'){ A.tid = b.dataset.id; A.tdate = v; A.from = A.scr; A.scr = 'turno'; renderPanel(); scrollTo(0,0); }
  if(a==='wnew'){ const p = (v||'').split('|'); A.w = {name:'', phone:'', cov:'Particular', date:p[0]||'', time:p[1]||'', fromDay:!!p[1]}; A.scr = 'new'; renderPanel(); scrollTo(0,0); }
  if(a==='wnext'){ const name = $('#nN').value.trim(); if(name.length<2){ toast('Falta el nombre.'); $('#nN').focus(); return; } Object.assign(A.w, {name, phone:$('#nP').value.trim(), cov:$('#nC').value}); A.scr = A.w.time ? 'confirm' : 'pick'; renderPanel(); scrollTo(0,0); }
  if(a==='reqturn'){ const r = S.reqs.find(x => x.id===b.dataset.id); if(r){ A.w = {name:r.name, phone:r.phone, cov:r.cov, avail:r.avail, req:r.id, date:'', time:''}; A.scr = 'pick'; renderPanel(); scrollTo(0,0); } }
  if(a==='wday'){ A.w.date = v; renderPanel(); }
  if(a==='wtime'){ A.w.time = v; A.scr = 'confirm'; renderPanel(); scrollTo(0,0); }
  if(a==='wsave'){ const w = A.w; if(turnoAt(w.date,w.time)){ toast('Ese horario ya está ocupado. Elegí otro.'); w.time = ''; A.scr = 'pick'; renderPanel(); return; }
    const t = {id:uid(), date:w.date, time:w.time, name:w.name, phone:w.phone, mode:c.modes[0], cov:w.cov, kind:'paciente', status:'confirmado', weekly:$('#nW').checked, skip:[]}; S.turnos.push(t);
    if(w.req) S.reqs = S.reqs.filter(x => x.id!==w.req); save(); renderSite(); A.w = null;
    if(t.phone){ const fee = c.fees.show && t.cov==='Particular' && c.fees.part ? ` La sesión es de ${money(c.fees.part)}.` : ''; showMsg(t, 'Turno guardado', `Hola ${t.name.split(' ')[0]}! Te confirmo el turno ${when(t.date)} a las ${t.time}${modeTxt(t)}.${fee} ${c.cancel}`.trim()); A.scr = 'msg'; }
    else { A.scr = 'home'; toast('Turno guardado.'); }
    renderPanel(); scrollTo(0,0); }
  if(a==='reqrej'){ const r = S.reqs.find(x => x.id===b.dataset.id); if(r){ showMsg(r, 'Aviso para '+r.name.split(' ')[0], `Hola ${r.name.split(' ')[0]}! Gracias por escribirme. En este momento no puedo tomar tu consulta. Espero que encuentres pronto un espacio.`); S.reqs = S.reqs.filter(x => x.id!==r.id); save(); A.scr = 'msg'; renderPanel(); scrollTo(0,0); } }
  if(a==='conf' || a==='rem' || a==='rej'){ const t = S.turnos.find(x => x.id===b.dataset.id); if(!t) return; const d = A.tdate, fn = t.name.split(' ')[0], o = c.os.find(x => x.n===t.cov);
    const fee = !c.fees.show ? '' : t.cov==='Particular' ? (c.fees.part ? ` La sesión es de ${money(c.fees.part)}.` : '') : (o && o.plus>0 ? ` Con ${o.n} hay un adicional de ${money(o.plus)} por sesión.` : '');
    if(a==='conf'){ t.status = 'confirmado'; save(); showMsg(t, 'Mensaje de confirmación', `Hola ${fn}! Te confirmo el turno ${when(d)} a las ${t.time}${modeTxt(t)}.${fee} ${c.cancel}`.trim()); }
    if(a==='rem') showMsg(t, 'Recordatorio', `Hola ${fn}! Te recuerdo tu turno ${when(d)} a las ${t.time}${modeTxt(t)}. Te espero.`);
    if(a==='rej'){ showMsg(t, 'Aviso para ' + fn, `Hola ${fn}! Gracias por escribirme. En este momento no puedo tomar tu consulta. Espero que encuentres pronto un espacio.`); S.turnos = S.turnos.filter(x => x.id!==t.id); save(); renderSite(); }
    A.scr = 'msg'; renderPanel(); scrollTo(0,0); }
  if(a==='ics'){ const t = S.turnos.find(x => x.id===b.dataset.id); if(t){ const u = URL.createObjectURL(new Blob([icsText(t, A.tdate)], {type:'text/calendar'})), l = document.createElement('a'); l.href = u; l.download = 'turno.ics'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); } }
  if(a==='cask'){ A.cmode = v; A.scr = 'cancel'; renderPanel(); scrollTo(0,0); }
  if(a==='cdo'){ const t = S.turnos.find(x => x.id===A.tid); if(!t) return; const d = A.tdate, fn = t.name.split(' ')[0];
    if(v==='yo') showMsg(t, 'Aviso para '+fn, `Hola ${fn}! Tengo que cancelar el turno ${when(d)} a las ${t.time}. Disculpá las molestias. Te escribo para pasarte otro horario.`);
    if(A.cmode==='skip'){ if(t.date===d) t.date = iso(addDays(day(t.date),7)); else (t.skip = t.skip||[]).push(d); } else S.turnos = S.turnos.filter(x => x.id!==t.id);
    save(); renderSite(); if(v==='yo') A.scr = 'msg'; else { A.scr = 'home'; toast('Turno cancelado. El horario quedó libre.'); } renderPanel(); scrollTo(0,0); }
  if(a==='msgx'){ A.msg = null; A.scr = 'home'; renderPanel(); scrollTo(0,0); }
  if(a==='skip'){ const t = S.turnos.find(x => x.id===b.dataset.id); if(t){ if(t.date===A.tdate) t.date = iso(addDays(day(t.date),7)); else (t.skip = t.skip||[]).push(A.tdate); save(); A.scr = 'home'; renderPanel(); renderSite(); toast('Ese día quedó libre.'); } }
  if(a==='del'){ S.turnos = S.turnos.filter(x => x.id!==b.dataset.id); save(); A.scr = 'home'; renderPanel(); renderSite(); toast('Turno cancelado. El horario quedó libre.'); }
  if(a==='block'){ c.blockedSlots.push(v); save(); renderPanel(); renderSite(); }
  if(a==='unblock'){ c.blockedSlots = c.blockedSlots.filter(x => x!==v); save(); renderPanel(); renderSite(); }
  if(a==='blockday'){ c.blocked.push(A.date); save(); renderPanel(); renderSite(); toast('Día bloqueado.'); }
  if(a==='unblockday'){ c.blocked = c.blocked.filter(x => x!==A.date); save(); renderPanel(); renderSite(); }
  if(a==='hsave'){ let bad = false; document.querySelectorAll('.hOn').forEach(i => { const d = i.dataset.d, f = document.querySelector('.hF[data-d="'+d+'"]').value, t = document.querySelector('.hT[data-d="'+d+'"]').value; if(i.checked && mins(t)<=mins(f)) bad = true; c.days[d] = {on:i.checked, from:f, to:t}; });
    if(bad){ toast('Revisá: la hora de cierre tiene que ser después de la de inicio.'); return; } c.step = Number($('#hS').value); c.dur = Number($('#hD').value); save(); renderPanel(); renderSite(); toast('Horarios guardados.'); }
  if(a==='msave'){ const ms = [...document.querySelectorAll('.mM:checked')].map(i => i.value); if(!ms.length){ toast('Marcá al menos una forma de atender.'); return; } c.name = $('#mN').value.trim() || c.name; { const ws = c.name.split(/\s+/).filter(w => w && !/\.$/.test(w)); if(ws.length){ c.short = ws[0]; c.mono = ws.map(w => w[0]).join('').slice(0,2).toUpperCase(); } } c.lic = $('#mL').value.trim(); c.role = $('#mR').value.trim() || c.role; c.wa = $('#mW').value.trim(); c.selfPick = $('#mS').value==='1'; c.modes = ms; c.place = $('#mP').value.trim(); c.cancel = $('#mC').value.trim(); save(); renderPanel(); renderSite(); toast('Guardado.'); }
  if(a==='osadd'){ readCobros(); const n = $('#oNew').value.trim(); if(!n){ toast('Escribí el nombre de la obra social.'); return; } c.os.push({n, on:true, plus:0}); save(); renderPanel(); renderSite(); }
  if(a==='osdel'){ readCobros(); c.os.splice(Number(v),1); save(); renderPanel(); renderSite(); }
  if(a==='csave'){ readCobros(); save(); renderPanel(); renderSite(); toast('Honorarios guardados.'); }
  if(a==='reset'){ S = seed(); save(); A.date = today(); A.scr = 'home'; renderPanel(); renderSite(); toast('Datos de ejemplo restaurados.'); }
  if(a==='out'){ A.ok = false; A.scr = 'home'; renderPanel(); scrollTo(0,0); }
});
document.addEventListener('change', e => { const fc = e.target.dataset && e.target.dataset.fc; if(fc) P.f[fc] = e.target.checked;  });
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.f; if(!k) return; P.f[k] = e.target.value; if(k==='cov'){ renderSite(); const el = $('#fC'); if(el) el.focus(); } });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='pin') $('[data-a="pin"]').click(); });

// ===== Arranque =====
function route(){ const p = location.hash==='#panel'; $('#site').hidden = p; $('#panel').hidden = !p; if(p) renderPanel(); else renderSite(); scrollTo(0,0); }
load(); addEventListener('hashchange', route); route();
</script>
